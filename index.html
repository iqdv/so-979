<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Opname</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF6F1;--card:#fff;--tx:#2B1118;--mu:#6B5258;--bd:#E5D3C0;--pr:#7A1830;--pr2:#F3E6D6;--ok:#1D6B3A;--gold:#B8935A;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Manrope","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:720px;margin:0 auto;padding:14px;padding-bottom:120px}
header{display:flex;justify-content:space-between;align-items:center;background:#4A0F20;color:#F6EBDD;margin:-14px -14px 12px;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 16px;border-radius:0 0 24px 24px}
h1{font:700 27px/1 "Cormorant Garamond",Georgia,serif;margin:0}h1 i{font-style:normal;color:#D8B77E}
.hr{display:flex;align-items:center;gap:8px}
#st{font-size:12px;color:#E9D9C6}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:12px}
nav button{flex:1;border:0;background:none;padding:9px 2px;border-radius:9px;font:inherit;font-weight:600;color:var(--mu)}
nav button.on{background:var(--pr2);color:var(--pr)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sub button{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:7px 14px;font-weight:600;color:var(--mu)}
.sub button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 6px rgba(224,54,75,.05)}
input,select,textarea{font:inherit;color:var(--tx);background:#fff;border:1px solid var(--bd);border-radius:9px;padding:9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 3px var(--pr2)}
label.f{display:block;font-size:12px;color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.g1{display:grid;gap:8px}
fieldset{border:0;padding:0;margin:0;min-width:0}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.sm{background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:7px 11px}
.x{background:none;border:0;color:var(--mu);padding:5px 8px;font-size:15px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.mu{color:var(--mu)}
.row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--pr2)}
.row input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--pr)}
.plu{color:var(--mu);width:64px;flex:none}.nm{flex:1;min-width:0}
.edr{padding:10px 0;border-bottom:1px solid var(--pr2)}
.ith{display:flex;justify-content:space-between;gap:8px}
.tr{display:grid;grid-template-columns:1fr 54px 80px 66px;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--pr2);background:#fff}
.tr.on{background:var(--pr2);box-shadow:inset 0 0 0 1.5px var(--gold)}
.tr input{padding:7px 4px;text-align:center;font-weight:700;border-radius:10px}.tr .fs{border-color:#D9C4AE;font-weight:800;font-size:16px}
.nmc b{font-size:12.5px;line-height:1.2;display:block}.nmc small{color:var(--mu);font-size:11px}
.chs{display:flex;flex-wrap:wrap;gap:3px;align-items:center;font-size:11px;color:var(--mu)}
.ch{padding:2px 8px;border-radius:99px;background:var(--pr2);color:var(--pr);font-weight:800;cursor:pointer}
.th{display:grid;grid-template-columns:1fr 54px 80px 66px;gap:6px;padding:0 10px 4px;font-size:10px;letter-spacing:.1em;font-weight:800;color:var(--mu);text-align:center}
.th span:first-child{text-align:left}.th span:last-child{text-align:right}
.tb{background:#fff;border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:10px}
.pl{font-size:11px;font-weight:800;padding:4px 6px;border-radius:99px;text-align:center}
.pl.n{color:#8A7078}.pl.m{background:#FBE4E6;color:#A3122E}.pl.p,.pl.ok{background:#E3F1E7;color:var(--ok)}
.fcs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.fc{padding:7px 13px;border-radius:99px;border:1px solid var(--bd);background:#fff;font-weight:800;color:var(--pr);white-space:nowrap}.fc.on{background:#4A0F20;border-color:#4A0F20;color:#F6EBDD}
.pn{position:fixed;bottom:0;left:0;right:0;max-width:720px;margin:0 auto;background:#fff;border-top:2px solid var(--gold);border-radius:18px 18px 0 0;padding:10px 14px;box-shadow:0 -8px 24px rgba(74,15,32,.18);z-index:7}
.qs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.qs .sm{flex:1;font-weight:800}.gd{border-color:var(--gold)}
.sm.on{background:#4A0F20;color:#F6EBDD;border-color:#4A0F20}
.ov{position:fixed;inset:0;background:rgba(43,17,24,.58);display:flex;align-items:flex-end;justify-content:center;z-index:8}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.cd{background:#4A0F20;color:#F6EBDD;border-radius:16px;padding:10px 16px;text-align:right;margin:8px 0}.cd small{color:#D8B77E;font-weight:700}.cd div{font:700 44px/1 "Cormorant Garamond",Georgia,serif}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.kp button{height:52px;border-radius:14px;border:0;background:#fff;font-size:20px;font-weight:700;box-shadow:0 1px 0 var(--bd)}.kp .o{background:var(--pr2)}
.rep{white-space:pre-wrap;background:var(--pr2);border-radius:10px;padding:10px;font:13px/1.5 "Manrope","Segoe UI",system-ui,sans-serif;max-height:340px;overflow:auto;margin:8px 0}
.lg{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--bd)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center;z-index:9}
#toast.on{opacity:1}
[hidden]{display:none!important}
</style></head><body><main>
<header><h1>Stock <i>Opname</i></h1><div class="hr"><span id="st"></span><button class="sm" id="rf" title="Muat ulang data" hidden>↻</button></div></header>

<!-- ===== LOGIN ===== -->
<section id="login" hidden>
<div class="card" id="l-url" hidden><b>Sambungkan ke server</b>
<p class="mu">Tempel URL Web App dari Apps Script (berakhiran /exec). Biasanya diberikan oleh admin.</p>
<input id="url" placeholder="https://script.google.com/macros/s/.../exec"><div class="bar"><button class="btn" id="saveurl">Simpan</button></div></div>
<div class="card" id="l-form" hidden><b id="l-title">Masuk</b>
<p class="mu" id="l-desc"></p>
<div class="g1" style="margin-top:8px">
<label class="f" id="l-nmw" hidden>Nama lengkap<input id="l-nm" autocomplete="name"></label>
<label class="f">Username<input id="l-u" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
<label class="f">Kata sandi<input id="l-p" type="password" autocomplete="current-password"></label></div>
<div class="bar"><button class="btn" id="l-go">Masuk</button><button class="x" id="l-chg">Ubah URL server</button></div></div>
</section>

<!-- ===== APLIKASI ===== -->
<div id="app" hidden>
<nav><button id="n-master" class="on">Master</button><button id="n-kkso">KKSO</button><button id="n-riwayat">Riwayat</button><button id="n-admin" hidden>Admin</button><button id="n-akun">Akun</button></nav>

<section id="t-master">
<div class="card"><input id="q" type="search" placeholder="Cari PLU atau nama item">
<div class="bar"><button class="sm" id="all">Pilih semua</button><button class="sm" id="none">Kosongkan</button><span class="mu">Dipilih <b id="cnt">0</b></span></div><div class="bar" id="rng"></div><div id="ml"></div></div>
<div class="card"><b>Mulai KKSO</b><div class="g" style="margin-top:8px"><label class="f">Tanggal<input type="date" id="mdt"></label><label class="f">Shift<select id="msh"><option>1</option><option>2</option><option>3</option></select></label><label class="f">Petugas<input id="mpt"></label></div><div class="bar"><button class="btn" id="mk">Buat KKSO</button></div></div>
</section>

<section id="t-kkso" hidden><div id="kb"></div></section>
<section id="t-riwayat" hidden>
<div class="card"><b>Laporan harian untuk grup</b>
<p class="mu">Hanya berisi item minus dan plus. Item yang klop tidak ditampilkan.</p>
<label class="f" style="max-width:200px">Tanggal<input type="date" id="rd"></label>
<div class="rep" id="rp"></div>
<div class="bar"><button class="btn" id="rwa">Kirim ke WhatsApp</button><button class="sm" id="rcp">Salin laporan</button></div></div>
<div id="rb"></div></section>

<section id="t-admin" hidden>
<div class="sub" id="sub"><button data-s="item">Item</button><button data-s="user">Pengguna</button><button data-s="lap">Laporan</button><button data-s="log">Aktivitas</button></div>
<div id="ab"></div>
</section>

<section id="t-akun" hidden>
<div class="card" id="me"></div>
<div class="card"><b>Ganti kata sandi</b><div class="g1" style="margin-top:8px">
<label class="f">Kata sandi lama<input id="pw0" type="password" autocomplete="current-password"></label>
<label class="f">Kata sandi baru (minimal 6 karakter)<input id="pw1" type="password" autocomplete="new-password"></label>
<label class="f">Ulangi kata sandi baru<input id="pw2" type="password" autocomplete="new-password"></label></div>
<div class="bar"><button class="btn" id="pwgo">Simpan</button></div></div>
<div class="card"><button class="sm" id="out">Keluar</button></div>
</section>
</div>
<div id="cm" class="ov" hidden><div class="sheet"><b style="font:700 22px 'Cormorant Garamond',Georgia,serif">Kalkulator cepat</b><div class="cd"><small id="cx">&nbsp;</small><div id="cr">0</div></div><div class="qs"><button class="sm" data-k="*6">&#215; 6</button><button class="sm" data-k="*12">&#215; 12</button><button class="sm" data-k="*24">&#215; 24</button><button class="sm" data-k="*40">&#215; 40</button></div><div class="kp" id="kp"></div><button class="btn" id="cuse" style="width:100%;margin-top:10px">Pakai sebagai hitungan</button><div class="bar"><button class="x" id="cclose">Tutup</button></div></div></div>
<div id="sm" class="ov" hidden><div class="sheet"><b style="font:700 22px 'Cormorant Garamond',Georgia,serif">SO selesai</b><div class="rep" id="smt"></div><div class="bar"><button class="btn" id="smcp">Salin teks</button><button class="sm" id="smwa">Kirim ke WhatsApp</button><button class="x" id="smx">Tutup</button></div></div></div>
<div id="toast"></div>
</main>
<script>
const DEFAULT_API="https://script.google.com/macros/s/AKfycbyv3pe5bVMCOgq8W3iT4YwmxhrjWrvMRpytqY_CuaaxbhnKgAZwEiIWosvn07Bruznl/exec";

const KEY="kkso_v3";
const SEED=`1595|SILVER QUEEN ALMOND 55/58G
5330|LANG M.KAYU PUTIH 120ML
5867|AQUA AIR MNRL PET 1500ML
113079|TROPICAL MYK GRG PET 2L
118898|GOOD DAY 3IN1 MOCACINO
120333|PUCUK HARUM TEH PET 359M
120766|SGM EKSPLOR 1+MADU BOX900
120767|SGM EKSPLOR 1+VANILA BOX 900
192730|BIMOLI MYK GRG PCH 2L.
196009|BEAR BRAND STERIL CAN189
230169|KINDER JOY FOR BOYS
230170|KINDER JOY FOR GIRL
244111|SUNCO MYK GRG PCH 2L
400552|ABC MILK COFFE PET 200
401181|FF SKM PUTIH PCH 535
401698|PSM GULA PREMIUM 1KG
406643|GMP GULA KRISTAL PUTIH 1KG
413095|ALFA ECO BAG 30X40AST
414212|INDOMILK KKM PUTIH PCH 535
414633|ALFA ECO BAG38X45
417804|KANZLER SGL ORI 65G
417805|KANZLER SGL KEJU 65G
421454|ALFAMART FAC TISSUE PACK
421456|ALFAMART FAC TISSUE400G
423992|KANZLER SGL HOT 65G
425651|INDOMILK COKLAT 6X115ML
432393|GOLDA CAPPUCINNO
435578|KANZER SGL GOCHUJANG
435736|KANZER BAKSO HOT
440715|GLAD2LOW MOIS POMEGRANA
443704|FIESTA RTG SOSIS SPICYKOREN
465771|KANZER BAKSO GOCHUJANG
990055|LE MINERALE AIR MNRL PET 600ml`.split("\n").map(l=>{const[p,n]=l.split("|");return{plu:p,name:n}});

let S={api:"",token:"",user:null,master:[],checked:[],sessions:[],cur:null};
let tab="master",q="",adm="item",setupMode=false;
let USERS=[],LOGS=[],aq="",editP=null,editU=null,LF={from:"",to:""};
try{const d=JSON.parse(localStorage.getItem(KEY));if(d)S={...S,...d}}catch(e){}
if(DEFAULT_API)S.api=DEFAULT_API;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify({api:S.api,token:S.token,user:S.user,master:S.master,checked:S.checked,cur:S.cur,sessions:S.sessions.filter(s=>!s.saved||s.id===S.cur)}))}catch(e){}};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const cur=()=>S.sessions.find(s=>s.id===S.cur);
const tot=it=>it.cnt.reduce((a,n)=>a+(+n||0),0);
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2800)};
const setSt=t=>$("#st").textContent=t;
const dif=it=>it.sys===""?null:tot(it)-(+it.sys);
const dtxt=d=>d<0?"minus "+Math.abs(d):d>0?"plus "+d:"sesuai";
const isAdmin=()=>!!S.user&&S.user.role==="admin";
const byDate=(a,b)=>(b.date+b.shift).localeCompare(a.date+a.shift);

async function call(action,data){
 const r=await fetch(S.api,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({...data,action,token:S.token})});
 let j;try{j=await r.json()}catch(e){throw new Error("Server tidak merespons. Cek URL Web App dan pastikan akses diset ke Anyone.")}
 if(!j.ok){if(j.error==="AUTH"){logout(true);throw new Error("Sesi berakhir, silakan masuk lagi.")}throw new Error(j.error||"Gagal")}
 return j}

async function pull(){
 setSt("Memuat…");
 try{const r=await call("load");
  S.user=r.me;S.master=r.master;
  const drafts=S.sessions.filter(s=>!s.saved&&s.owner===S.user.username);
  S.sessions=[...r.sessions,...drafts.filter(d=>!r.sessions.some(x=>x.id===d.id))];
  S.checked=S.checked.filter(p=>S.master.some(m=>m.plu===p));
  if(S.cur&&!S.sessions.some(s=>s.id===S.cur))S.cur=null;
  persist();setSt("Tersinkron ✓");render()}
 catch(e){setSt("Gagal memuat");toast(e.message)}}

async function showLogin(){
 $("#app").hidden=true;$("#rf").hidden=true;$("#login").hidden=false;setSt("");
 $("#l-url").hidden=!!S.api;$("#l-form").hidden=!S.api;
 if(!S.api){$("#url").value="";return}
 setupMode=false;
 try{setupMode=!!(await call("status")).needsSetup}catch(e){toast(e.message)}
 $("#l-title").textContent=setupMode?"Buat akun admin pertama":"Masuk";
 $("#l-desc").textContent=setupMode?"Belum ada pengguna. Akun ini akan menjadi admin yang mengatur item, pengguna, dan laporan.":"Masuk dengan akun yang diberikan admin.";
 $("#l-nmw").hidden=!setupMode;$("#l-go").textContent=setupMode?"Buat admin dan masuk":"Masuk";
 $("#l-p").autocomplete=setupMode?"new-password":"current-password"}
function logout(expired){S.token="";S.user=null;persist();if(expired)toast("Sesi berakhir, silakan masuk lagi.");showLogin()}
function enterApp(){
 $("#login").hidden=true;$("#app").hidden=false;$("#rf").hidden=false;
 $("#n-admin").hidden=!isAdmin();$("#mpt").value=S.user.name;$("#mdt").value=today();
 show("master");pull()}

$("#saveurl").onclick=()=>{const u=$("#url").value.trim();if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u))return toast("URL harus berakhiran /exec");S.api=u;persist();showLogin()};
$("#l-chg").onclick=()=>{S.api="";persist();showLogin()};
$("#l-go").onclick=async()=>{
 const u=$("#l-u").value.trim().toLowerCase(),p=$("#l-p").value;
 if(!u||!p)return toast("Isi username dan kata sandi.");
 const b=$("#l-go");b.disabled=true;
 try{const r=await call(setupMode?"setup":"login",{username:u,password:p,name:$("#l-nm").value.trim()});
  S.token=r.token;S.user=r.user;
  S.sessions=S.sessions.filter(s=>s.owner===r.user.username);
  $("#l-p").value="";persist();enterApp()}
 catch(e){toast(e.message)}
 finally{b.disabled=false}};
$("#l-p").addEventListener("keydown",e=>{if(e.key==="Enter")$("#l-go").click()});
$("#out").onclick=()=>{if(confirm("Keluar dari akun ini?"))logout(false)};
$("#rf").onclick=async()=>{await pull();if(tab==="admin"){if(adm==="user")loadUsers();if(adm==="log")loadLogs()}};

const TABS=["master","kkso","riwayat","admin","akun"];
function show(t){if(t==="admin"&&!isAdmin())t="master";tab=t;TABS.forEach(x=>{$("#t-"+x).hidden=x!==t;$("#n-"+x).classList.toggle("on",x===t)});render()}
function render(){({master:rM,kkso:rK,riwayat:rR,admin:rA,akun:rAk}[tab])()}
TABS.forEach(x=>$("#n-"+x).onclick=()=>show(x));

function rRng(){const n=Math.ceil(S.master.length/20);$("#rng").innerHTML=n?'<span class="mu">Centang per 20:</span>'+Array.from({length:n},(_,j)=>{const a=j*20,b=Math.min(a+20,S.master.length);const all=S.master.slice(a,b).every(m=>S.checked.includes(m.plu));return `<button class="sm${all?" on":""}" data-r="${j}">${a+1}–${b}</button>`}).join(""):""}
$("#rng").addEventListener("click",e=>{const j=e.target.dataset.r;if(j===undefined)return;const a=+j*20,ps=S.master.slice(a,a+20).map(m=>m.plu),all=ps.every(p=>S.checked.includes(p));S.checked=all?S.checked.filter(p=>!ps.includes(p)):[...new Set([...S.checked,...ps])];persist();rM()});
function rM(){rRng();const k=q.toLowerCase();
 const l=S.master.filter(m=>(m.plu+" "+m.name).toLowerCase().includes(k));
 $("#ml").innerHTML=l.map(m=>`<label class="row"><input type="checkbox" data-plu="${esc(m.plu)}" ${S.checked.includes(m.plu)?"checked":""}><span class="plu">${esc(m.plu)}</span><span class="nm">${esc(m.name)}</span></label>`).join("")
  ||`<p class="mu">${S.master.length?"Item tidak ditemukan.":"Master masih kosong. "+(isAdmin()?"Buka tab Admin, menu Item, untuk menambah atau memuat daftar awal.":"Hubungi admin.")}</p>`;
 $("#cnt").textContent=S.checked.length}
$("#q").oninput=e=>{q=e.target.value;rM()};
$("#ml").addEventListener("change",e=>{const p=e.target.dataset.plu;if(!p)return;S.checked=e.target.checked?[...new Set([...S.checked,p])]:S.checked.filter(x=>x!==p);persist();$("#cnt").textContent=S.checked.length;rRng()});
$("#all").onclick=()=>{S.checked=S.master.map(m=>m.plu);persist();rM()};
$("#none").onclick=()=>{S.checked=[];persist();rM()};
$("#mk").onclick=()=>{const it=S.master.filter(m=>S.checked.includes(m.plu));if(!it.length)return toast("Centang minimal satu item.");
 const s={id:"S"+Date.now(),date:$("#mdt").value||today(),shift:$("#msh").value,petugas:$("#mpt").value.trim()||S.user.name,owner:S.user.username,ownerName:S.user.name,saved:false,base:{},log:[],items:it.map(m=>({plu:m.plu,name:m.name,sys:"",cnt:[]}))};
 S.sessions.unshift(s);S.cur=s.id;persist();show("kkso")};

let sel=0,fil="all";
const stOf=it=>{const d=dif(it);if(d===null||!it.cnt.length)return["n","Belum"];return d<0?["m","Minus "+(-d)]:d>0?["p","Plus "+d]:["ok","Klop"]};
const chs=it=>it.cnt.map((n,j)=>(j?"+":"")+`<span class="ch" data-x="${j}">${esc(n)} ×</span>`).join("");
const trow=(it,i)=>{const[k,t]=stOf(it);return `<div class="tr${i===sel?" on":""}" data-i="${i}"><div class="nmc"><b>${esc(it.name)}</b><small>${i+1} · ${esc(it.plu)}</small><div class="chs">${chs(it)}</div></div><input type="number" inputmode="numeric" data-sys value="${esc(it.sys)}" aria-label="Stok sistem"><input class="fs" inputmode="decimal" data-fis value="${esc(it.cnt.join("+"))}" placeholder="0" aria-label="Fisik SO"><span class="pl ${k}">${t}</span></div>`};
function panel(s){const it=s.items[sel];if(!it)return"";

 else{const r=t.closest(".tr");if(!r)return;const i=+r.dataset.i,it=s.items[i];
  if("sys" in t.dataset)it.sys=t.value;else if("fis" in t.dataset)it.cnt=t.value.split("+").map(x=>x.trim().replace(",",".")).filter(x=>x!==""&&!isNaN(x));
  sync(i)}
 persist()});
kb.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const r=e.target.closest(".tr");if(!r)return;e.preventDefault();const n=r.nextElementSibling;if(n){const x=n.querySelector(e.target.classList.contains("fs")?".fs":"input");if(x){x.focus();n.scrollIntoView({block:"center",behavior:"smooth"})}}});

 const ch=t.closest(".ch");if(ch){const i=+ch.closest(".tr").dataset.i;s.items[i].cnt.splice(+ch.dataset.x,1);persist();rowRe(i);return}
 const q=t.closest("[data-q]");if(q){addCnt(+q.dataset.q);return}

 if(t.closest("[data-calc]")){openCalc();return}
 const mv=t.closest("[data-mv]");if(mv){const j=sel+(+mv.dataset.mv);if(j<0||j>=s.items.length)return;[s.items[sel],s.items[j]]=[s.items[j],s.items[sel]];sel=j;persist();rK();return}
 const fc=t.closest("[data-f]");if(fc){fil=fc.dataset.f;rK();return}
 if(t.id==="kadd"){const p=$("#kpl").value.trim();if(!p)return toast("Isi PLU.");if(s.items.some(i=>i.plu===p))return toast("Item sudah ada.");
  let m=S.master.find(x=>x.plu===p);if(!m){const n=$("#knm").value.trim().toUpperCase();if(!n)return toast("PLU tidak ada di master: isi nama.");m={plu:p,name:n}}
  s.items.push({plu:m.plu,name:m.name,sys:"",cnt:[]});persist();rK()}
 else if(t.id==="ksave")saveSO(s,t);
 else if(t.id==="kwa"){if(!s.saved)return toast("Simpan SO dulu sebelum dibagikan.");share(report(s.date,[s]))}
 else if(t.id==="kcopy")copyT(report(s.date,[s]))});
let ex="";
const ev=()=>{try{const v=ex.replace(/,/g,".");if(!v||!/^[0-9+\-*/. ]+$/.test(v))return null;const r=Function('"use strict";return ('+v+')')();return isFinite(r)?Math.round(r*1000)/1000:null}catch(e){return null}};
function cshow(){const r=ev();$("#cx").innerHTML=esc(ex.replace(/\*/g,"×").replace(/\//g,"÷").replace(/-/g,"−"))||"&nbsp;";$("#cr").textContent=r===null?"0":r}
function openCalc(){ex="";cshow();$("#cm").hidden=false}
$("#kp").innerHTML=["C","⌫","÷","×","7","8","9","−","4","5","6","+","1","2","3","=","0","00","."].map(k=>`<button data-k="${k}" class="${"C⌫÷×−+=".includes(k)?"o":""}" style="${k==="0"?"grid-column:span 2":""}">${k}</button>`).join("");

 if(k==="C")ex="";else if(k==="⌫")ex=ex.slice(0,-1);else if(k==="=")ex=ev()===null?ex:String(ev());
 else ex+=({"÷":"/","×":"*","−":"-"})[k]||k;cshow()});

async function saveSO(s,btn){
 const c=JSON.parse(JSON.stringify(s)),now=new Date().toLocaleString("id-ID");
 c.items.forEach(i=>{const b=c.base[i.plu],T=tot(i);if(c.saved&&b!==T)c.log.push({t:now,plu:i.plu,name:i.name,from:b===undefined?null:b,to:T,by:S.user.name})});
 c.base={};c.items.forEach(i=>c.base[i.plu]=tot(i));c.saved=true;c.savedAt=now;
 const rows=c.items.map(i=>{const d=dif(i);return[c.id,c.date,c.shift,c.petugas,i.plu,i.name,i.sys,tot(i),d===null?"":d,i.cnt.join("+"),c.savedAt]});
 btn.disabled=true;setSt("Menyimpan…");
 try{await call("session_save",{session:c,rows});Object.assign(s,c);persist();setSt("Tersinkron ✓");toast("SO tersimpan");showSum(s)}
 catch(e){setSt("Gagal menyimpan");toast("Gagal menyimpan: "+e.message+" (draft aman di perangkat ini)")}
 if(tab==="kkso")rK()}

const fmtD=d=>{const[y,m,x]=d.split("-").map(Number);return new Date(y,m-1,x).toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"})};
const fmtS=d=>{const[y,m,x]=d.split("-").map(Number);return new Date(y,m-1,x).toLocaleDateString("id-ID",{weekday:"long"})+", "+String(x).padStart(2,"0")+"/"+String(m).padStart(2,"0")+"/"+y};
function report(date,list){
 const L=[fmtS(date)];let nm=0,np=0,qm=0,qp=0,nu=0;
 list.slice().sort((a,b)=>String(a.shift).localeCompare(String(b.shift))).forEach(s=>{
  const rows=[];
  s.items.forEach(i=>{const d=dif(i);if(d===null){nu++;return}
   if(d<0){nm++;qm-=d}else if(d>0){np++;qp+=d}
   if(d!==0)rows.push(i.name+" - "+i.sys+" - "+tot(i)+" - ("+(d>0?"+":"")+d+")")});
  const who=s.ownerName||s.petugas;
  L.push("","Shift "+s.shift+(who?" ("+who+")":""));
  if(!rows.length)L.push("Semua item klop.");
  else{L.push("Item - Onhand - Fisik - Selisih");rows.forEach(r=>L.push(r))}
  if(s.log.length){L.push("Perubahan qty:");s.log.forEach(g=>L.push("- "+g.name+": "+(g.from===null?"baru":g.from)+" jadi "+g.to+(g.by?" (oleh "+g.by+")":"")))}});
 L.push("");
 if(!nm&&!np)L.push("Total: tidak ada selisih, semua item klop.");
 else L.push("Total: "+[nm?"minus "+nm+" item (-"+qm+")":"",np?"plus "+nm+" item (+"+qp+")":""].filter(Boolean).join(", "));
 if(nu)L.push("Catatan: "+nu+" item belum diisi stok sistem, tidak dibandingkan.");
 return L.join("\n")}
function reportMulti(list){const ds=[...new Set(list.map(s=>s.date))].sort();return ds.map(d=>report(d,list.filter(s=>s.date===d))).join("\n\n----------\n\n")}

${cards||'<div class="card mu">Belum ada SO tersimpan pada tanggal ini.</div>'}`}

function rAG(){$("#ab").innerHTML=`<div class="card"><b>Aktivitas terakhir</b> <span class="mu">(maks. 200)</span>${LOGS.map(g=>`<div class="lg"><span class="mu">${esc(g.t)}</span><br><b>${esc(g.u)}</b>: ${esc(g.a)}${g.d?", "+esc(g.d):""}</div>`).join("")||'<p class="mu">Memuat…</p>'}</div>`}

$("#ab").addEventListener("input",e=>{if(e.target.id==="aq"){aq=e.target.value;$("#al").innerHTML=aList()}});
$("#ab").addEventListener("change",e=>{const k=e.target.dataset.lf;if(!k)return;LF[k]=e.target.value||today();if(LF.to<LF.from){if(k==="from")LF.to=LF.from;else LF.from=LF.to}rAL()});
$("#ab").addEventListener("click",async e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,row=b.closest("[data-p],[data-u],[data-id]");
 if(a==="i-add"){const p=$("#ap").value.trim(),n=$("#an").value.trim().toUpperCase();
  if(!p||!n)return toast("Isi PLU dan nama.");if(S.master.some(m=>m.plu===p))return toast("PLU sudah ada.");
  mutMaster(l=>[...l,{plu:p,name:n}],"Item ditambahkan")}
 else if(a==="i-ed"){editP=row.dataset.p;$("#al").innerHTML=aList()}
 else if(a==="i-cx"){editP=null;$("#al").innerHTML=aList()}
 else if(a==="i-sv"){const old=row.dataset.p,p=row.querySelector("[data-f=p]").value.trim(),n=row.querySelector("[data-f=n]").value.trim().toUpperCase();
  if(!p||!n)return toast("Isi PLU dan nama.");if(p!==old&&S.master.some(m=>m.plu===p))return toast("PLU sudah dipakai item lain.");
  editP=null;S.checked=S.checked.map(x=>x===old?p:x);mutMaster(l=>l.map(m=>m.plu===old?{plu:p,name:n}:m),"Item diperbarui")}
 else if(a==="i-dl"){const p=row.dataset.p,m=S.master.find(x=>x.plu===p);if(!confirm(`Hapus ${p} ${m?m.name:""} dari master?`))return;
  S.checked=S.checked.filter(x=>x!==p);mutMaster(l=>l.filter(x=>x.plu!==p),"Item dihapus")}
 else if(a==="i-imp"){let add=0,upd=0,skip=0;const lines=$("#ai").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length)return toast("Tempel datanya dulu.");
  mutMaster(l=>{lines.forEach(x=>{const m=x.match(/^([^\t|,;]+?)\s*[\t|,;]\s*(.+)$/);if(!m||/^plu$/i.test(m[1])){skip++;return}
    const p=m[1].trim(),n=m[2].trim().toUpperCase(),i=l.findIndex(z=>z.plu===p);
    if(i>=0){l[i].name=n;upd++}else{l.push({plu:p,name:n});add++}});
   if(!add&&!upd){toast("Tidak ada baris yang valid. Format: PLU lalu Nama.");return null}return l},
   `Impor: ${add} baru, ${upd} diperbarui${skip?", "+skip+" dilewati":""}`);}
 else if(a==="i-up"||a==="i-dn"){const i=S.master.findIndex(m=>m.plu===row.dataset.p),j=i+(a==="i-up"?-1:1);if(j<0||j>=S.master.length)return;mutMaster(l=>{[l[i],l[j]]=[l[j],l[i]];return l},"Urutan diubah")}
 else if(a==="i-seed"){mutMaster(()=>SEED.map(m=>({...m})),"Daftar awal dimuat")}
 else if(a==="u-add"){const u={isNew:true,name:$("#un").value,username:$("#uu").value,role:$("#ur").value,password:$("#up").value};
  b.disabled=true;try{await call("user_save",{user:u});toast("Pengguna ditambahkan");await loadUsers()}catch(er){toast(er.message)}b.disabled=false}
 else if(a==="u-ed"){editU=row.dataset.u;rAU()}
 else if(a==="u-cx"){editU=null;rAU()}
 else if(a==="u-sv"){const f=k=>row.querySelector(`[data-f=${k}]`);
  const u={isNew:false,username:row.dataset.u,name:f("n").value,role:f("r").value,active:f("a").value==="1",password:f("p")?f("p").value:""};
  b.disabled=true;try{await call("user_save",{user:u});editU=null;toast("Pengguna diperbarui");await loadUsers()}catch(er){toast(er.message)}b.disabled=false}
 else if(a==="u-dl"){const un=row.dataset.u;if(!confirm("Hapus pengguna @"+un+"? Data SO yang sudah dibuat tetap tersimpan."))return;
  try{await call("user_delete",{username:un});toast("Pengguna dihapus");await loadUsers()}catch(er){toast(er.message)}}
 else if(a==="l-rs"){LF={from:"",to:""};rAL()}
 else if(a==="l-wa"){const l=lapSessions();if(l.length)share(reportMulti(l))}
 else if(a==="l-cp"){const l=lapSessions();if(l.length)copyT(reportMulti(l))}});

$("#mdt").value=today();
(S.token&&S.user&&S.api)?enterApp():showLogin();
</script></body></html>
