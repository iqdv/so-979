<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KKSO Alfa</title>
<style>
:root{--bg:#fff7f7;--card:#fff;--tx:#241418;--mu:#8a6f75;--bd:#f2cfd3;--pr:#e0364b;--pr2:#fde8eb;--ok:#12803c;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Inter","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:640px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px}h1 i{font-style:normal;color:var(--pr)}
#st{font-size:12px;color:var(--mu)}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:12px}
nav button{flex:1;border:0;background:none;padding:9px 2px;border-radius:9px;font:inherit;font-weight:600;color:var(--mu)}
nav button.on{background:var(--pr2);color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 6px rgba(224,54,75,.05)}
input,select,textarea{font:inherit;color:var(--tx);background:#fff;border:1px solid var(--bd);border-radius:9px;padding:9px;width:100%;min-width:0}
input:focus,select:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 3px var(--pr2)}
label.f{display:block;font-size:12px;color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
button{font:inherit;cursor:pointer}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.sm{background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:7px 11px}
.x{background:none;border:0;color:var(--mu);padding:5px 8px;font-size:15px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.mu{color:var(--mu)}
.row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--pr2)}
.row input{width:20px;height:20px;flex:none;accent-color:var(--pr)}
.plu{color:var(--mu);width:60px;flex:none}.nm{flex:1}
.ith{display:flex;justify-content:space-between;gap:8px}
.prev{margin:6px 0;padding:6px 9px;border-radius:9px;background:var(--pr2);font-size:13px}
.prev.m{border-left:3px solid var(--pr)}
.top{display:flex;gap:8px;align-items:end;margin:8px 0}
.top label{width:96px}
.cin{font-size:20px;font-weight:600;text-align:center}
.tot{min-width:70px;text-align:right}.tot b{font-size:26px;color:var(--pr)}
.sel{display:block;font-size:12px;font-weight:600}.sel.m{color:var(--pr)}.sel.z,.sel.p{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chips input{width:62px;text-align:center;padding:6px;border-radius:999px;background:var(--pr2);border-color:transparent;font-weight:600}
.chips span{color:var(--mu)}
.log{font-size:13px;padding:5px 0;border-bottom:1px dashed var(--bd)}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--pr2);color:var(--pr);font-weight:600}
.badge.ok{background:#e4f6ea;color:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1}
[hidden]{display:none!important}
</style></head><body><main>
<header><h1>KKSO <i>Alfa</i></h1><span id="st"></span></header>
<nav><button id="n-master" class="on">Master</button><button id="n-kkso">KKSO</button><button id="n-riwayat">Riwayat</button><button id="n-set">Sambung</button></nav>

<section id="t-master">
<div class="card"><input id="q" type="search" placeholder="Cari PLU atau nama item">
<div class="bar"><button class="sm" id="all">Pilih semua</button><button class="sm" id="none">Kosongkan</button><span class="mu">Dipilih <b id="cnt">0</b></span></div><div id="ml"></div></div>
<div class="card"><b>Tambah item master</b><div class="g" style="margin-top:8px"><label class="f">PLU<input id="ap" inputmode="numeric"></label><label class="f">Nama item<input id="an"></label></div><div class="bar"><button class="sm" id="addm">Tambah</button></div></div>
<div class="card"><b>Mulai KKSO</b><div class="g" style="margin-top:8px"><label class="f">Tanggal<input type="date" id="mdt"></label><label class="f">Shift<select id="msh"><option>1</option><option>2</option><option>3</option></select></label><label class="f">Petugas<input id="mpt"></label></div><div class="bar"><button class="btn" id="mk">Buat KKSO</button></div></div>
</section>

<section id="t-kkso" hidden><div id="kb"></div></section>
<section id="t-riwayat" hidden><div id="rb"></div></section>
<section id="t-set" hidden><div class="card"><b>Sambungkan ke Google Sheets</b>
<p class="mu">Tempel URL Web App dari Apps Script (panduan ada di README). Semua orang yang memakai URL yang sama akan berbagi master dan riwayat SO. Kosongkan untuk mode lokal.</p>
<input id="url" placeholder="https://script.google.com/macros/s/.../exec"><div class="bar"><button class="btn" id="saveurl">Simpan dan muat ulang data</button></div></div></section>
<div id="toast"></div>
</main>
<script>
const SEED=`1595|SILVER QUEEN ALMOND 55/58G
5330|LANG M.KAYU PUTIH 120ML
5867|AQUA AIR MNRL PET 1500ML
113079|TROPICAL MYK GRG PET 2L
118898|GOOD DAY 3IN1 MOCACINO
120333|PUCUK HARUM TEH PET 359M
120766|SGM EKSPLOR 1+MADU BOX900
120767|SGM EKSPLOR 1+VANILA BOX 900
192730|BIMOLI MYK GRG PCH 2L.
196009|BEAR BRAND STERIL CAN189
230169|KINDER JOY FOR BOYS
230170|KINDER JOY FOR GIRL
244111|SUNCO MYK GRG PCH 2L
400552|ABC MILK COFFE PET 200
401181|FF SKM PUTIH PCH 535
401698|PSM GULA PREMIUM 1KG
406643|GMP GULA KRISTAL PUTIH 1KG
413095|ALFA ECO BAG 30X40AST
414212|INDOMILK KKM PUTIH PCH 535
414633|ALFA ECO BAG38X45
417804|KANZLER SGL ORI 65G
417805|KANZLER SGL KEJU 65G
421454|ALFAMART FAC TISSUE PACK
421456|ALFAMART FAC TISSUE400G
423992|KANZLER SGL HOT 65G
425651|INDOMILK COKLAT 6X115ML
432393|GOLDA CAPPUCINNO
435578|KANZER SGL GOCHUJANG
435736|KANZER BAKSO HOT
440715|GLAD2LOW MOIS POMEGRANA
443704|FIESTA RTG SOSIS SPICYKOREN
465771|KANZER BAKSO GOCHUJANG
990055|LE MINERALE AIR MNRL PET 600ml`.split("\n").map(l=>{const[p,n]=l.split("|");return{plu:p,name:n}});
let S={master:SEED,checked:[],sessions:[],cur:null,api:""},tab="master",q="";
try{const d=JSON.parse(localStorage.getItem("kkso_v2"));if(d&&d.master)S=d}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const persist=()=>{try{localStorage.setItem("kkso_v2",JSON.stringify(S))}catch(e){}};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const cur=()=>S.sessions.find(s=>s.id===S.cur);
const tot=it=>it.cnt.reduce((a,n)=>a+(+n||0),0);
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)};
const setSt=t=>$("#st").textContent=t;
const dif=(it)=>it.sys===""?null:tot(it)-(+it.sys);
const dtxt=d=>d<0?"minus "+Math.abs(d):d>0?"plus "+d:"sesuai";

/* ---- sinkron Google Sheets ---- */
async function post(o){persist();if(!S.api)return;try{setSt("Menyimpan…");const r=await fetch(S.api,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(o)});await r.json();setSt("Tersinkron ✓")}catch(e){setSt("Gagal sinkron, tersimpan lokal");toast("Gagal sinkron. Data aman di perangkat ini.")}}
async function pull(){if(!S.api){setSt("Mode lokal");return}
 try{setSt("Memuat…");const r=await(await fetch(S.api)).json();
  if(r.master&&r.master.length)S.master=r.master;else post({action:"master",master:S.master});
  S.sessions=[...(r.sessions||[]),...S.sessions.filter(s=>!s.saved&&!(r.sessions||[]).some(x=>x.id===s.id))];
  persist();setSt("Tersinkron ✓");render()}catch(e){setSt("Gagal memuat, pakai data lokal")}}

/* ---- navigasi ---- */
function show(t){tab=t;["master","kkso","riwayat","set"].forEach(x=>{$("#t-"+x).hidden=x!==t;$("#n-"+x).classList.toggle("on",x===t)});render()}
function render(){tab==="master"?rM():tab==="kkso"?rK():tab==="riwayat"?rR():$("#url").value=S.api}
["master","kkso","riwayat","set"].forEach(x=>$("#n-"+x).onclick=()=>show(x));

/* ---- master ---- */
function rM(){const k=q.toLowerCase();
 $("#ml").innerHTML=S.master.filter(m=>(m.plu+" "+m.name).toLowerCase().includes(k)).map(m=>`<label class="row"><input type="checkbox" data-plu="${esc(m.plu)}" ${S.checked.includes(m.plu)?"checked":""}><span class="plu">${esc(m.plu)}</span><span class="nm">${esc(m.name)}</span><button class="x" data-del="${esc(m.plu)}" title="Hapus">✕</button></label>`).join("")||'<p class="mu">Item tidak ditemukan.</p>';
 $("#cnt").textContent=S.checked.length}
$("#q").oninput=e=>{q=e.target.value;rM()};
$("#ml").addEventListener("change",e=>{const p=e.target.dataset.plu;if(!p)return;S.checked=e.target.checked?[...new Set([...S.checked,p])]:S.checked.filter(x=>x!==p);persist();$("#cnt").textContent=S.checked.length});
$("#ml").addEventListener("click",e=>{const p=e.target.dataset.del;if(!p)return;e.preventDefault();if(confirm("Hapus item "+p+" dari master?")){S.master=S.master.filter(m=>m.plu!==p);S.checked=S.checked.filter(x=>x!==p);post({action:"master",master:S.master});rM()}});
$("#all").onclick=()=>{S.checked=S.master.map(m=>m.plu);persist();rM()};
$("#none").onclick=()=>{S.checked=[];persist();rM()};
$("#addm").onclick=()=>{const p=$("#ap").value.trim(),n=$("#an").value.trim().toUpperCase();
 if(!p||!n)return toast("Isi PLU dan nama.");if(S.master.some(m=>m.plu===p))return toast("PLU sudah ada.");
 S.master.push({plu:p,name:n});S.checked.push(p);$("#ap").value=$("#an").value="";post({action:"master",master:S.master});rM();toast("Item ditambahkan")};
$("#mk").onclick=()=>{const it=S.master.filter(m=>S.checked.includes(m.plu));if(!it.length)return toast("Centang minimal satu item.");
 const s={id:"S"+Date.now(),date:$("#mdt").value||today(),shift:$("#msh").value,petugas:$("#mpt").value,saved:false,base:{},log:[],items:it.map(m=>({plu:m.plu,name:m.name,sys:"",cnt:[]}))};
 S.sessions.unshift(s);S.cur=s.id;persist();show("kkso")};

/* ---- shift sebelumnya ---- */
function prevOf(s,plu){const k=s.date+s.shift;let b=null;
 S.sessions.forEach(o=>{if(o.id===s.id||!o.saved||o.date+o.shift>=k)return;const it=o.items.find(i=>i.plu===plu);if(it&&(!b||o.date+o.shift>b.k))b={k:o.date+o.shift,o,it}});return b}
function prevHtml(s,it){const p=prevOf(s,it.plu);if(!p)return"";const d=dif(p.it),h=tot(p.it);
 return `<div class="prev ${d<0?"m":""}">Shift lalu (${esc(p.o.date)} S${esc(p.o.shift)}): hasil ${h}${d===null?"":`, <b>${dtxt(d)}${d?" "+Math.abs(d):""}</b>`}</div>`}

/* ---- KKSO aktif ---- */
function card(s,it,i){const d=dif(it);
 return `<div class="card it" data-i="${i}"><div class="ith"><div><b>${esc(it.name)}</b><div class="mu">${esc(it.plu)}</div></div><button class="x" data-rm title="Hapus dari KKSO">✕</button></div>
${prevHtml(s,it)}
<div class="top"><label class="f">Stok sistem<input type="number" inputmode="numeric" data-sys value="${esc(it.sys)}"></label><label class="f" style="flex:1;width:auto">Hitung, lalu Enter<input class="cin" type="number" inputmode="numeric" enterkeyhint="next" data-cin placeholder="0"></label><div class="tot"><b>${tot(it)}</b><span class="sel ${d===null?"":d<0?"m":d>0?"p":"z"}">${d===null?"":dtxt(d)+(d?" "+Math.abs(d):"")}</span></div></div>
<div class="chips">${it.cnt.map((n,j)=>`${j?"<span>+</span>":""}<input type="number" inputmode="numeric" data-ch="${j}" value="${esc(n)}">`).join("")}</div></div>`}
function rc(i,focus){const s=cur(),c=$("#kb").querySelector(`.it[data-i="${i}"]`);c.outerHTML=card(s,s.items[i],i);if(focus)$("#kb").querySelector(`.it[data-i="${i}"] [data-cin]`).focus()}
function rK(){const s=cur(),b=$("#kb");
 if(!s){b.innerHTML='<div class="card mu">Belum ada KKSO aktif. Centang item di tab Master, lalu tekan Buat KKSO.</div>';return}
 b.innerHTML=`<div class="card"><div class="g"><label class="f">Tanggal<input type="date" id="kd" value="${esc(s.date)}"></label><label class="f">Shift<select id="ks">${[1,2,3].map(n=>`<option ${s.shift==n?"selected":""}>${n}</option>`).join("")}</select></label><label class="f">Petugas<input id="kp" value="${esc(s.petugas)}"></label></div>
<div class="bar"><span class="badge ${s.saved?"ok":""}">${s.saved?"Tersimpan":"Draft"}</span><button class="btn" id="ksave">${s.saved?"Simpan perubahan":"Simpan SO"}</button><button class="sm" id="kcopy">Salin ringkasan</button></div></div>`
 +s.items.map((it,i)=>card(s,it,i)).join("")
 +`<div class="card"><b>Tambah item lain</b><div class="g" style="margin-top:8px"><label class="f">PLU<input id="kpl" inputmode="numeric"></label><label class="f">Nama (jika baru)<input id="knm"></label></div><div class="bar"><button class="sm" id="kadd">Tambah ke KKSO</button></div></div>`
 +(s.log.length?`<div class="card"><b>Perubahan setelah disimpan</b>${s.log.slice().reverse().map(l=>`<div class="log"><span class="mu">${esc(l.t)}</span><br>${esc(l.name)}: ${l.from===null?"baru":l.from} → <b>${l.to}</b></div>`).join("")}</div>`:"")}
const kb=$("#kb");
kb.addEventListener("input",e=>{const s=cur(),t=e.target;if(!s)return;
 if(t.id==="kd")s.date=t.value;else if(t.id==="ks")s.shift=t.value;else if(t.id==="kp")s.petugas=t.value;
 else{const c=t.closest(".it");if(!c)return;const it=s.items[c.dataset.i];
  if("sys" in t.dataset){it.sys=t.value;rcKeep(c,s,it)}else if("ch" in t.dataset){it.cnt[+t.dataset.ch]=t.value;rcKeep(c,s,it)}}
 persist()});
function rcKeep(c,s,it){const d=dif(it),sl=c.querySelector(".sel");c.querySelector(".tot b").textContent=tot(it);
 sl.textContent=d===null?"":dtxt(d)+(d?" "+Math.abs(d):"");sl.className="sel "+(d===null?"":d<0?"m":d>0?"p":"z")}
kb.addEventListener("keydown",e=>{const t=e.target,s=cur();if(e.key!=="Enter"||!s)return;
 const c=t.closest(".it");if(!c)return;const i=+c.dataset.i,it=s.items[i];
 if("cin" in t.dataset){e.preventDefault();
  if(t.value!==""){it.cnt.push(t.value);persist();rc(i,true)}
  else{const n=kb.querySelectorAll(".it")[i+1];if(n){n.querySelector("[data-cin]").focus();n.scrollIntoView({block:"center",behavior:"smooth"})}}}
 else if("ch" in t.dataset||"sys" in t.dataset){e.preventDefault();c.querySelector("[data-cin]").focus()}});
kb.addEventListener("change",e=>{const t=e.target,s=cur();if(!s||!("ch" in t.dataset))return;const c=t.closest(".it"),i=+c.dataset.i,it=s.items[i];
 if(t.value==="")it.cnt.splice(+t.dataset.ch,1);persist();rc(i)});
kb.addEventListener("click",e=>{const s=cur(),t=e.target;if(!s)return;
 if("rm" in t.dataset){const c=t.closest(".it");if(confirm("Hapus item ini dari KKSO?")){s.items.splice(+c.dataset.i,1);persist();rK()}}
 else if(t.id==="kadd"){const p=$("#kpl").value.trim();if(!p)return toast("Isi PLU.");if(s.items.some(i=>i.plu===p))return toast("Item sudah ada.");
  let m=S.master.find(x=>x.plu===p);if(!m){const n=$("#knm").value.trim().toUpperCase();if(!n)return toast("PLU baru: isi nama.");m={plu:p,name:n};S.master.push(m);post({action:"master",master:S.master})}
  s.items.push({plu:m.plu,name:m.name,sys:"",cnt:[]});persist();rK()}
 else if(t.id==="ksave"){saveSO(s)}
 else if(t.id==="kcopy"){const x=`KKSO ${s.date} Shift ${s.shift} ${s.petugas}\n`+s.items.map(i=>{const d=dif(i);return `${i.plu} ${i.name}: ${tot(i)}${d===null?"":` (${dtxt(d)}${d?" "+Math.abs(d):""})`}`}).join("\n");
  (navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(()=>toast("Ringkasan disalin")).catch(()=>prompt("Salin teks ini:",x))}});
function saveSO(s){const now=new Date().toLocaleString("id-ID");
 s.items.forEach(i=>{const b=s.base[i.plu],T=tot(i);if(s.saved&&b!==T)s.log.push({t:now,plu:i.plu,name:i.name,from:b===undefined?null:b,to:T})});
 s.base={};s.items.forEach(i=>s.base[i.plu]=tot(i));s.saved=true;s.savedAt=now;
 const rows=s.items.map(i=>{const d=dif(i);return[s.id,s.date,s.shift,s.petugas,i.plu,i.name,i.sys,tot(i),d===null?"":d,i.cnt.join("+"),s.savedAt]});
 post({action:"session",session:s,rows}).then(()=>{toast("SO tersimpan");rK()})}

/* ---- riwayat ---- */
function rR(){const l=S.sessions.slice().sort((a,b)=>(b.date+b.shift).localeCompare(a.date+a.shift));
 $("#rb").innerHTML=l.map(s=>{const m=s.items.filter(i=>dif(i)<0&&dif(i)!==null).length;
 return `<div class="card ith"><div><b>${esc(s.date)} · Shift ${esc(s.shift)}</b> <span class="badge ${s.saved?"ok":""}">${s.saved?"Tersimpan":"Draft"}</span><div class="mu">${s.items.length} item${s.petugas?" · "+esc(s.petugas):""}${m?` · ${m} minus`:""}${s.log.length?` · ${s.log.length} perubahan`:""}</div></div><div><button class="sm" data-o="${s.id}">Buka</button><button class="x" data-d="${s.id}" title="Hapus">✕</button></div></div>`}).join("")||'<div class="card mu">Belum ada riwayat SO.</div>'}
$("#rb").addEventListener("click",e=>{const d=e.target.dataset;
 if(d.o){S.cur=d.o;persist();show("kkso")}
 else if(d.d&&confirm("Hapus KKSO ini beserta laporannya?")){S.sessions=S.sessions.filter(s=>s.id!==d.d);if(S.cur===d.d)S.cur=null;post({action:"delete",id:d.d});rR()}});

$("#saveurl").onclick=()=>{S.api=$("#url").value.trim();persist();toast(S.api?"Menyambung…":"Mode lokal");pull()};
$("#mdt").value=today();rM();pull();
</script></body></html>
