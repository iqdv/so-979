<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4A0F20">
<title>KKSO: Stock Opname dan Laporan Kasir</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--wine:#4A0F20;--wine2:#7A1830;--gold:#D8B77E;--cream:#FAF6F1;--sand:#F3E6D6;--line:#EFE3D6;--tx:#2B1118;--mu:#6B5258;--bad:#A3122E;--ok:#2F6B4F}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--tx);font:14px/1.45 Manrope,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.hero{background:var(--wine);color:#F6EBDD;padding:calc(36px + env(safe-area-inset-top)) 22px 28px;border-radius:0 0 30px 30px}
.eyb{font-size:11px;letter-spacing:.22em;color:var(--gold);font-weight:800}
.hero h1{font:700 34px/1.05 'Cormorant Garamond',Georgia,serif;margin:6px 0 4px}
.hero p{margin:0;font-size:12.5px;opacity:.85}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 48px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 32px rgba(74,15,32,.08);margin-top:16px}
.card h3{margin:0 0 4px;font:700 22px 'Cormorant Garamond',Georgia,serif}
.mu{color:var(--mu);font-size:12.5px}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-top:12px}
input{width:100%;height:48px;border:1.5px solid #D9C4AE;border-radius:14px;padding:0 14px;font:600 15px Manrope,sans-serif;background:#FFFDF9;color:var(--tx);margin-top:5px}
input:focus{outline:0;border-color:var(--wine2);box-shadow:0 0 0 3px rgba(122,24,48,.14)}
.btn{display:block;width:100%;height:48px;border:0;border-radius:14px;background:var(--wine);color:#F6EBDD;font:800 15px Manrope,sans-serif;margin-top:16px}
.btn.g{background:#fff;color:var(--wine);border:1.5px solid #D9C4AE}
.btn.s{height:38px;font-size:13px;margin-top:0;width:auto;padding:0 14px;border-radius:12px}
.btn:disabled{opacity:.55}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row .btn{margin-top:0;flex:1}
.tabs{display:flex;background:var(--sand);border-radius:14px;padding:4px;margin-bottom:6px}
.tabs button{flex:1;height:38px;border:0;background:0;border-radius:11px;font:800 13px Manrope,sans-serif;color:var(--mu)}
.tabs .on{background:#fff;color:var(--wine);box-shadow:0 1px 3px rgba(74,15,32,.12)}
.msg{color:var(--bad);font-size:12.5px;font-weight:600;min-height:18px;margin-top:10px}
.menu{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 12px 32px rgba(74,15,32,.08)}
.menu:active{transform:scale(.99)}
.ico{width:58px;height:58px;border-radius:18px;background:var(--wine);color:var(--gold);display:grid;place-items:center;flex:none}
.menu b{font:700 25px/1.1 'Cormorant Garamond',Georgia,serif;display:block}
.menu small{color:var(--mu);font-size:12.5px}.menu i{margin-left:auto;color:var(--wine2);font-style:normal;font-size:22px}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:11px;font-weight:800;background:var(--sand);color:var(--wine)}
.pill.on{background:var(--wine2);color:#fff}.pill.bad{background:#FBE4E6;color:var(--bad)}
.logo{width:64px;height:64px;border-radius:20px;border:1.5px solid var(--gold);display:grid;place-items:center;color:var(--gold);margin-bottom:12px}
.shell{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:10px;background:var(--wine);color:#F6EBDD;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;flex:none}
.bar button{height:34px;border-radius:10px;border:1px solid rgba(216,183,126,.6);background:0;color:var(--gold);font:800 12.5px Manrope,sans-serif;padding:0 12px}
.bar b{font:700 20px 'Cormorant Garamond',Georgia,serif}
#fr{flex:1;width:100%;border:0;background:var(--cream)}
.ov{position:fixed;inset:0;background:rgba(43,17,24,.62);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.ov[hidden]{display:none}.ov .card{width:100%;max-width:400px;margin:0}
#t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--wine);color:#F6EBDD;padding:10px 18px;border-radius:99px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90%;text-align:center}
#t.on{opacity:1}
.st{padding:12px 0;border-top:1px solid var(--line)}.st:first-child{border:0}
.st .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.kv{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:4px;flex-wrap:wrap}.kv b{color:var(--tx)}
</style></head><body>
<div id="v"></div><div id="m" class="ov" hidden></div><div id="t"></div>

const err=m=>{m=String(m||'');if(m.startsWith('SEDANG_DIGUNAKAN'))return'SO ini sedang dipakai '+(m.split(':')[1]||'perangkat lain')+'. Coba lagi beberapa menit.';return ERR[m]||(/Failed to fetch|NetworkError|abort|Load failed/i.test(m)?'Tidak bisa terhubung. Periksa internet.':m)};
function toast(t){const e=$('#t');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2800)}
async function rpc(fn,a){const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);try{const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify(a||{}),signal:c.signal});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&(j.message||j.hint))||'HTTP '+r.status);return j}finally{clearTimeout(t)}}
const tok=()=>S.stafToken||S.token;
async function call(fn,a){
  try{return await rpc(fn,{...a,p_token:tok()})}
  catch(e){
    if(e.message==='AUTH'){
      if(S.stafToken){S.stafToken='';S.nik='';S.nama='';save();toast('Sesi staf berakhir. Login staf lagi bila perlu.');
        return rpc(fn,{...a,p_token:S.token}).catch(e2=>{if(e2.message==='AUTH')logout(1);throw e2})}
      logout(1)}
    throw e}}
function logout(exp){const had=S.token;S.token=S.stafToken='';S.nik=S.nama='';save();if(had&&S.code)rpc('store_leave',{p_token:had}).catch(()=>{});S.code=S.store='';save();go('login');if(exp===1)toast('Sesi berakhir, silakan masuk lagi.')}
window.SHELL={call,err,dev,token:tok,code:()=>S.code,store:()=>S.store,home:()=>go('home'),logout:x=>logout(x),
  user:()=>({name:S.nama||S.crew||'Crew',username:S.nik||('crew-'+(S.crew||'x').toLowerCase().replace(/[^a-z0-9]+/g,'-')),staf:!!S.stafToken})};
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));
const IC={so:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
 ks:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>'};
let mode='in',OWN='';
const V=$('#v'),M=$('#m');
function modal(h){M.innerHTML='<div class="card">'+h+'</div>';M.hidden=false}
const closeM=()=>{M.hidden=true;M.innerHTML=''};
M.addEventListener('mousedown',e=>{if(e.target===M)closeM()});

function go(v,x){closeM();document.body.style.overflow='';
  if(v!=='login'&&!S.token)v='login';
  ({login:vLogin,home:vHome,app:vApp,owner:vOwner})[v](x)}

function vLogin(){
  const reg=mode==='reg';
  V.innerHTML=`<div class="hero"><div class="logo">${IC.so}</div><div class="eyb">KKSO</div><h1>Stock Opname<br>dan Laporan Kasir</h1><p>Satu aplikasi untuk semua toko. Masuk dengan kode toko dan PIN.</p></div>
  <div class="wrap"><div class="card"><div class="tabs"><button id="t1" class="${reg?'':'on'}">Masuk toko</button><button id="t2" class="${reg?'on':''}">Daftar toko baru</button></div>
  <label>Nama kamu<input id="nm" autocomplete="name" placeholder="mis. Budi" value="${esc(S.crew)}"></label>
  <label>Kode toko<input id="lc" autocapitalize="characters" autocomplete="off" placeholder="mis. SUDIRMAN-01"></label>
  ${reg?'<label>Nama toko<input id="ln" autocomplete="off" placeholder="mis. Toko Sudirman"></label>':''}
  <label>${reg?'Buat PIN toko (min. 6 karakter)':'PIN toko'}<input id="lp" type="password" autocomplete="off"></label>
  ${reg?'<label>Kode ACC Toko (dari pemilik aplikasi)<input id="la" type="password" autocomplete="off"></label>':''}
  <div class="msg" id="lm"></div><button class="btn" id="lb">${reg?'Daftar dan masuk':'Masuk'}</button></div></div>`;
  $('#t1').onclick=()=>{mode='in';vLogin()};$('#t2').onclick=()=>{mode='reg';vLogin()};
  V.onkeydown=e=>{if(e.key==='Enter'&&$('#lb'))$('#lb').click()};
  $('#lb').onclick=async()=>{
    const nm=$('#nm').value.trim(),c=$('#lc').value.trim().toUpperCase(),p=$('#lp').value,m=t=>{$('#lm').textContent=t},b=$('#lb');
    if(nm.length<2)return m('Isi nama kamu dulu.');
    if(!/^[A-Z0-9-]{6,20}$/.test(c))return m(ERR.KODE_TIDAK_VALID);
    if(!p)return m('Isi PIN toko.');
    b.disabled=true;m('');
    try{
      if(reg){const n=$('#ln').value.trim(),a=$('#la').value;if(!n){m('Isi nama toko.');return}if(!a){m('Isi Kode ACC Toko.');return}
        const r=await rpc('register_store',{p_acc:a,p_code:c,p_name:n,p_pin:p});if(r!=='OK'){m(err(r));return}}
      const r=await rpc('store_enter',{p_code:c,p_pin:p});
      if(!r||!r.ok){m(err(r&&r.error));return}
      S={token:r.token,stafToken:'',code:r.code,store:r.store,nik:'',nama:'',crew:nm};save();mode='in';go('home')
    }catch(e){m(err(e.message))}finally{b.disabled=false}}}

function vHome(){
  const u=SHELL.user();
  V.innerHTML=`<div class="hero"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><div class="eyb">${esc(S.code)}</div><h1>${esc(S.store)}</h1><p>Halo, ${esc(u.name)}</p></div><span class="pill ${u.staf?'on':''}">${u.staf?'Staf':'Crew'}</span></div></div>
  <div class="wrap"><button class="menu" id="mso"><span class="ico">${IC.so}</span><span><b>Stock Opname</b><small>Hitung stok, rak, riwayat, dan laporan selisih</small></span><i>›</i></button>
  <button class="menu" id="mks"><span class="ico">${IC.ks}</span><span><b>Laporan Kasir</b><small>Isi 3 shift, total harian, kirim ke WhatsApp</small></span><i>›</i></button>
  <div class="card"><h3>Akses staf</h3>
  ${u.staf?`<p class="mu">Masuk sebagai <b>${esc(S.nama)}</b> (@${esc(S.nik)}). Menu Admin Stock Opname dan reset hari laporan aktif.</p><div class="row"><button class="btn g s" id="so_out">Keluar mode staf</button></div>`
  :`<p class="mu">Crew bisa mengisi SO dan laporan. Staf bisa juga mengubah master item, rak, data, dan menghapus.</p><div class="row"><button class="btn s" id="sl">Login staf</button><button class="btn g s" id="sr">Buat akun staf</button></div>`}</div>
  <div class="row" style="margin-top:18px"><button class="btn g s" id="nmb">Ubah nama</button><button class="btn g s" id="own">Dashboard pemilik</button><button class="btn g s" id="lo">Keluar toko</button></div></div>`;
  $('#mso').onclick=()=>go('app','so');$('#mks').onclick=()=>go('app','ks');
  $('#lo').onclick=()=>{if(confirm('Keluar dari toko ini di perangkat ini?'))logout()};
  $('#nmb').onclick=()=>{const n=(prompt('Nama kamu:',S.crew)||'').trim();if(n.length>=2){S.crew=n;save();vHome()}};
  $('#own').onclick=ownerLogin;
  if($('#so_out'))$('#so_out').onclick=()=>{S.stafToken='';S.nik=S.nama='';save();vHome()};
  if($('#sl'))$('#sl').onclick=stafLogin;if($('#sr'))$('#sr').onclick=stafReg}

function vApp(w){
  const ttl=w==='so'?'Stock Opname':'Laporan Kasir';
  V.innerHTML=`<div class="shell"><div class="bar"><button id="bk">‹ Beranda</button><b>${ttl}</b></div><iframe id="fr" title="${ttl}"></iframe></div>`;
  $('#bk').onclick=()=>go('home');
  $('#fr').srcdoc=dec(w==='so'?SO_B64:KS_B64)}

function stafLogin(){
  modal(`<h3>Login staf</h3><p class="mu">Pakai NIK dan kata sandi akun staf toko ini.</p><label>NIK<input id="sn" autocapitalize="none" autocomplete="username"></label><label>Kata sandi<input id="sp" type="password" autocomplete="current-password"></label><div class="msg" id="sm"></div><div class="row"><button class="btn g" id="sc">Batal</button><button class="btn" id="sg">Masuk</button></div>`);
  $('#sc').onclick=closeM;
  $('#sg').onclick=async()=>{const b=$('#sg');b.disabled=true;$('#sm').textContent='';
    try{const r=await rpc('staf_login',{p_token:S.token,p_nik:$('#sn').value,p_pass:$('#sp').value});
      if(!r||!r.ok){$('#sm').textContent=err(r&&r.error);return}
      S.stafToken=r.token;S.nik=r.nik;S.nama=r.nama;save();toast('Masuk sebagai staf');vHome();closeM()
    }catch(e){if(e.message==='AUTH')return logout(1);$('#sm').textContent=err(e.message)}finally{b.disabled=false}}}

function stafReg(){
  modal(`<h3>Buat akun staf</h3><p class="mu">Butuh Kode ACC Staf dari pemilik aplikasi.</p><label>Kode ACC Staf<input id="ra" type="password" autocomplete="off"></label><label>NIK / ID unik (huruf kecil, angka)<input id="rn" autocapitalize="none" autocomplete="off"></label><label>Nama lengkap<input id="rm"></label><label>Kata sandi (min. 6)<input id="rp" type="password" autocomplete="new-password"></label><div class="msg" id="rr"></div><div class="row"><button class="btn g" id="rc">Batal</button><button class="btn" id="rg">Buat akun</button></div>`);
  $('#rc').onclick=closeM;
  $('#rg').onclick=async()=>{const b=$('#rg');b.disabled=true;
    try{const r=await rpc('staf_register',{p_token:S.token,p_acc:$('#ra').value,p_nik:$('#rn').value,p_nama:$('#rm').value,p_pass:$('#rp').value});
      if(r!=='OK'){$('#rr').textContent=err(r);return}
      toast('Akun staf dibuat. Silakan login staf.');closeM();stafLogin()
    }catch(e){if(e.message==='AUTH')return logout(1);$('#rr').textContent=err(e.message)}finally{b.disabled=false}}}

function ownerLogin(){
  modal(`<h3>Dashboard pemilik</h3><p class="mu">Pantau semua toko. Butuh Kode Pemilik.</p><label>Kode Pemilik<input id="oc" type="password" autocomplete="off"></label><div class="msg" id="om"></div><div class="row"><button class="btn g" id="ox">Batal</button><button class="btn" id="og">Buka</button></div>`);
  $('#ox').onclick=closeM;
  $('#og').onclick=async()=>{const b=$('#og'),c=$('#oc').value;b.disabled=true;
    try{const r=await rpc('owner_overview',{p_owner:c});if(!r||!r.ok){$('#om').textContent=err(r&&r.error);return}OWN=c;closeM();vOwner(r.stores)}
    catch(e){$('#om').textContent=err(e.message)}finally{b.disabled=false}}}

async function ownerReload(){try{const r=await rpc('owner_overview',{p_owner:OWN});if(r&&r.ok)vOwner(r.stores);else toast(err(r&&r.error))}catch(e){toast(err(e.message))}}
function vOwner(st){
  V.innerHTML=`<div class="hero"><div class="eyb">PEMILIK APLIKASI</div><h1>Semua toko</h1><p>${st.length} toko terdaftar</p></div><div class="wrap"><div class="card" style="margin-top:16px">
  ${st.map(s=>`<div class="st" data-c="${esc(s.code)}"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(s.name)}</b><div class="mu">${esc(s.code)} · sejak ${esc(s.created)}</div></div><span class="pill ${s.active?'on':'bad'}">${s.active?'Aktif':'Nonaktif'}</span></div>
  <div class="kv"><span><b>${s.staf}</b> staf</span><span><b>${s.so}</b> SO</span><span><b>${s.kasir}</b> shift kasir</span><span>Terakhir: <b>${esc(s.last||'-')}</b></span></div>
  <div class="acts"><button class="btn g s" data-a="act">${s.active?'Nonaktifkan':'Aktifkan'}</button><button class="btn g s" data-a="pin">Ganti PIN</button><button class="btn g s" data-a="pw">Reset sandi staf</button></div></div>`).join('')||'<p class="mu">Belum ada toko.</p>'}</div>
  <div class="row" style="margin-top:16px"><button class="btn g" id="ob">‹ Beranda</button><button class="btn g" id="orf">Muat ulang</button></div></div>`;
  $('#ob').onclick=()=>{OWN='';go('home')};$('#orf').onclick=ownerReload;
  V.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const c=b.closest('[data-c]').dataset.c,a=b.dataset.a;
    try{let r;
      if(a==='act'){if(!confirm('Ubah status toko '+c+'?'))return;const on=b.textContent.trim()==='Aktifkan';r=await rpc('owner_store',{p_owner:OWN,p_code:c,p_active:on,p_new_pin:''})}
      else if(a==='pin'){const p=prompt('PIN baru untuk '+c+' (min. 6 karakter). Semua perangkat toko harus masuk ulang:');if(!p)return;r=await rpc('owner_store',{p_owner:OWN,p_code:c,p_active:null,p_new_pin:p})}
      else{const n=prompt('NIK staf yang direset sandinya:');if(!n)return;const p=prompt('Kata sandi baru (min. 6 karakter):');if(!p)return;r=await rpc('owner_staf',{p_owner:OWN,p_code:c,p_nik:n,p_active:null,p_new_pass:p})}
      if(r&&r.ok){toast('Tersimpan');ownerReload()}else toast(err(r&&r.error))
    }catch(er){toast(err(er.message))}}}

S.token?go('home'):go('login');
</script></body></html>
