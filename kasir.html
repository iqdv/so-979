<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10233B">
<title>Laporan Fokus Marketing</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#EEF1F6;color:#1e293b;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
h1,h2{margin:0}h2{font-size:16px}
.top{background:linear-gradient(120deg,#0b1f38,#0a4a43);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.top h1{font-size:16px}.top p{margin:0;font-size:12px;opacity:.75}
.dt{display:flex;gap:6px;align-items:center}
.dt button,.dt input{height:34px;border-radius:8px;border:1px solid #2C4666;background:#1B3350;color:#fff;font:inherit;padding:0 10px;color-scheme:dark;cursor:pointer}
#chip{font-size:12px;opacity:.8}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;max-width:1200px;margin:auto}
#tabs button{flex:0 0 auto;border:0;border-radius:12px;padding:8px 16px;background:#fff;color:#475569;text-align:left;font:inherit;cursor:pointer}
#tabs button b{display:block}#tabs small{font-size:11px;opacity:.8}
#tabs button.on{background:#10233B;color:#fff}
main{max-width:1200px;margin:auto;padding:12px 16px 32px}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:960px){.cols{grid-template-columns:7fr 5fr}.out{position:sticky;top:72px;align-self:start}}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,35,59,.05),0 14px 32px -18px rgba(16,35,59,.22)}
.cols .card:last-child{margin-bottom:0}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.mu{margin:2px 0 0;font-size:12px;color:#64748b}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.g2.s{grid-template-columns:1fr}}
label{display:block;font-size:12px;font-weight:600;color:#475569}
input,textarea{width:100%;font:inherit;font-size:14px;color:#0f172a;background:#f8fafc;border:1px solid #dbe1ea;border-radius:12px;padding:9px 12px;margin-top:4px;outline:0}
input:focus,textarea:focus{border-color:#0B6B5D;box-shadow:0 0 0 3px rgba(11,107,93,.15)}
.bx{border:1px solid #e2e8f0;border-radius:14px;padding:12px;background:#fafbfd}
.bar{height:6px;background:#e2e8f0;border-radius:6px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:440px}
th{font-size:12px;color:#64748b;text-align:left;padding:6px;border-bottom:1px solid #e5e9f0}
td{padding:3px 4px;border-bottom:1px solid #f1f5f9}
td input{margin:0;padding:7px 8px;border-radius:10px;background:#fff}
td input[type=number]{width:80px;text-align:center}
td.c{text-align:center;font-weight:700;white-space:nowrap}
.w{display:block;font-size:10px;color:#b45309}
.x{border:0;background:0;color:#94a3b8;font-size:20px;cursor:pointer;padding:0 8px}.x:hover{color:#e11d48}
.bg{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.bg.g{background:#d1fae5;color:#065f46}.bg.b{background:#dbeafe;color:#1e40af}.bg.a{background:#fef3c7;color:#92400e}
.btn{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:#0B6B5D}
.btn.d{background:#10233B}.btn.l{background:#fff;color:#334155;border:1px solid #cbd5e1}
.ad{border:0;border-radius:10px;padding:7px 12px;font:inherit;font-size:12px;font-weight:600;color:#0B6B5D;background:#E4F2EF;cursor:pointer}
.gh{border:0;background:0;font:inherit;font-size:12px;font-weight:600;color:#64748b;cursor:pointer;padding:6px 8px;border-radius:8px}.gh:hover{background:#f1f5f9}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:960px){.kp{grid-template-columns:1.6fr 1fr 1fr 1fr}}
.k{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 14px 28px -20px rgba(16,35,59,.35)}
.k.w2{grid-column:span 2}@media(min-width:960px){.k.w2{grid-column:auto}}
.k span{font-size:12px;font-weight:600;color:#64748b}
.k strong{display:block;font-size:24px;letter-spacing:-.02em;color:#10233B;line-height:1.25;margin-top:2px}
.k strong small{font-size:13px;color:#94a3b8;font-weight:600}
.k em{font-style:normal;font-size:12px;color:#64748b}
.tg label{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:500;color:#1e293b;margin-bottom:8px}
.tg input{width:auto;margin:0;accent-color:#0B6B5D}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;resize:vertical}
.act{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.empty{text-align:center;padding:32px 16px}.empty p{color:#64748b;max-width:340px;margin:6px auto 14px}
.rp{font-size:12.5px;color:#111827}.rp h1{font-size:20px;font-weight:800}.rp .sub{color:#64748b;margin-top:2px}
.rp h3{font-size:13px;margin:18px 0 6px}.rp table{min-width:0}
.rp th,.rp td{border:1px solid #d5dae1;padding:6px 8px;vertical-align:top;color:#111827}
.rp th{background:#f1f3f6;font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rp .n{text-align:right}.rp tfoot td{font-weight:700;background:#f8f9fb}.rp .meta th{width:80px}.rp .m{color:#64748b;font-weight:400}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:28px;text-align:center}.sg div{border-top:1px solid #111;padding-top:4px;margin-top:56px}
.ft{margin-top:16px;font-size:11px;color:#94a3b8}
.cols.one{grid-template-columns:1fr!important}.cols.one #main{max-width:780px;margin:0 auto;width:100%}
.sub{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px}
.sub button{flex:1 0 auto;display:flex;align-items:center;gap:8px;border:1px solid #dbe1ea;background:#fff;border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;color:#475569;cursor:pointer}
.sub button i{font-style:normal;width:22px;height:22px;border-radius:50%;background:#e2e8f0;display:grid;place-items:center;font-size:12px}
.sub button.on{background:#0B6B5D;border-color:#0B6B5D;color:#fff}.sub button.on i{background:rgba(255,255,255,.25)}
.pick{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 16px}
.pick label{display:flex;align-items:center;gap:8px;font-size:14px;color:#1e293b;border:1px solid #dbe1ea;border-radius:12px;padding:10px 14px;cursor:pointer;margin:0}
.pick input{width:auto;margin:0;accent-color:#0B6B5D}
.nx{display:flex;justify-content:flex-end}
.pa{display:none}
[hidden]{display:none!important}
.ov{position:fixed;inset:0;background:rgba(16,35,59,.72);display:grid;place-items:center;z-index:20;padding:16px}.ov[hidden]{display:none}
#sn{font-weight:600}
@page{size:A4;margin:14mm}
@media print{.no-print{display:none!important}.pa{display:block}body{background:#fff}}
</style>
</head>
<body>
<header class="top no-print">
  <div><a href="index.html" style="color:inherit;font-size:13px;font-weight:700;text-decoration:none">← Menu</a><h1>Laporan Kasir</h1><p><span id="sn">belum masuk</span> · <span id="chip"></span></p></div>
  <div class="dt">
    <input type="date" id="dt" aria-label="Tanggal laporan">
    <button id="rs">Reset hari ini</button>
    <button id="lo">Ganti toko</button>
  </div>
</header>
<nav id="tabs" class="no-print"></nav>
<main>
  <section id="kpi" class="no-print"></section>
  <div class="cols" id="cols" style="margin-top:16px">
    <div id="main" class="no-print"></div>
    <aside class="card out no-print">
      <div class="hd"><h2 id="ot">Laporan WhatsApp</h2><span class="mu">Bisa diedit sebelum disalin</span></div>
      <div class="tg">
        <label>Tampilkan ACV % per item <input type="checkbox" id="oa"></label>
        <label>Sertakan stok kemasan <input type="checkbox" id="op"></label>
        <label>Sertakan tanggal <input type="checkbox" id="od"></label>
      </div>
      <textarea id="tx" rows="16" spellcheck="false"></textarea>
      <div class="act"><button class="btn" id="cp">Salin</button><button class="btn d" id="wa">Kirim WA</button><button class="btn l" id="pr">Cetak</button></div>
    </aside>
  </div>
</main>
<div id="pa" class="pa"></div>

<div id="lg" class="ov no-print" hidden>
  <div class="card" style="width:100%;max-width:380px;margin:0">
    <div class="sub" style="margin-bottom:12px"><button id="m1" type="button" class="on">Masuk</button><button id="m2" type="button">Daftar toko baru</button></div>
    <p class="mu" id="lgh"></p>
    <label style="margin-top:12px">Kode toko<input id="lc" autocomplete="off" autocapitalize="characters" placeholder="mis. SUDIRMAN-01"></label>
    <label id="fn" style="margin-top:10px" hidden>Nama toko<input id="ln" autocomplete="off" placeholder="mis. Toko Sudirman"></label>
    <label id="fp" style="margin-top:10px" hidden>PIN pendaftaran<input id="lp" type="password" autocomplete="off" placeholder="PIN dari pemilik aplikasi"></label>
    <p id="lgm" class="mu" style="color:#b91c1c;min-height:18px;margin:8px 0"></p>
    <button class="btn" id="lb" style="width:100%">Masuk</button>
  </div>
</div>

<script>
const $=i=>document.getElementById(i),KEY='laporan_kasir_gh_v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{v=parseFloat(v);return v>0?v:0},fmt=n=>new Intl.NumberFormat('id-ID').format(n||0);
const pc=(a,t)=>t>0?Math.round(a/t*100):0,use=p=>Math.max(0,num(p.aw)-num(p.ak)),r1=n=>Math.round(n*10)/10;
const iso=(d=new Date())=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const ld=s=>new Date(s+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const addD=(s,k)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+k);return iso(d)};
const col=p=>p>=100?'#0B6B5D':p>=70?'#2563eb':'#d97706';
const bd=(t,a)=>{if(!t)return a>0?'<span class="bg g">Ada sales</span>':'<span class="mu">–</span>';const p=pc(a,t);return`<span class="bg ${p>=100?'g':p>=70?'b':'a'}">${p}%</span>`};
const ac=(t,a)=>t>0?pc(a,t)+'%':'–';

const MK=[['PSM',25],['PWP',15],['SERBA',15],['SEGER',22],['RTD BEANSPOT',100],['TELUR 10s',0],['BOTOL',0],['NEW MEMBER',0]];
const PK=[['Cup',200],['Kantong Kertas',100],['Kain Sedang',50],['Kain Besar',30]];
const S={date:iso(),view:'1',sub:'data',o:{acv:false,pack:true,dt:true},days:{},tot:{use:{1:true,2:true,3:true},es:null}};

// Shift: {kasir,staff,st,sa,tstd,astd,m:[{n,t,a}],k:[{n,aw,ak}]}
const mk=p=>p?{kasir:'',staff:p.staff,st:p.st,sa:0,tstd:p.tstd,astd:'',m:p.m.map(x=>({n:x.n,t:x.t,a:0})),k:p.k.map(x=>({n:x.n,aw:num(x.ak),ak:num(x.ak)}))}
  :{kasir:'',staff:'',st:2500000,sa:0,tstd:'100%',astd:'',m:MK.map(([n,t])=>({n,t,a:0})),k:PK.map(([n,a])=>({n,aw:a,ak:a}))};
const day=()=>S.days.cur||(S.days.cur={});
const prev=n=>{const d=day();for(let k=n-1;k>0;k--)if(d[k])return d[k];return null};
const sh=n=>day()[n]||(day()[n]=mk(prev(n)));
const fill=s=>num(s.sa)>0||s.m.some(x=>num(x.a)>0)||s.k.some(x=>use(x)>0);
const ents=(d='cur')=>[1,2,3].map(n=>({n,s:(S.days[d]||{})[n]})).filter(e=>e.s&&fill(e.s));
const view=()=>S.view==='total'?(S.tot.es||[]):[{n:+S.view,s:sh(+S.view)}];

// Penjumlahan beberapa shift
function agg(es){
  const o={t:0,a:0,sd:[]},im=new Map,pm=new Map;
  es.forEach(({n,s})=>{
    o.t+=num(s.st);o.a+=num(s.sa);
    const v=parseFloat(String(s.astd).replace(',','.'));if(String(s.astd).trim()&&isFinite(v))o.sd.push(v);
    s.m.forEach(x=>{const k=x.n.trim().toUpperCase();if(!k)return;let i=im.get(k);if(!i)im.set(k,i={n:x.n.trim(),t:0,a:0,p:{}});i.t+=num(x.t);i.a+=num(x.a);i.p[n]=(i.p[n]||0)+num(x.a)});
    s.k.forEach(x=>{const k=x.n.trim().toUpperCase();if(!k)return;let i=pm.get(k);if(!i)pm.set(k,i={n:x.n.trim(),aw:num(x.aw),ak:0,u:0,p:{}});i.ak=num(x.ak);const u=use(x);i.u+=u;i.p[n]=(i.p[n]||0)+u});
  });
  o.it=[...im.values()];o.pk=[...pm.values()];o.sa=o.sd.length?o.sd.reduce((x,y)=>x+y,0)/o.sd.length:null;return o;
}

// Teks WhatsApp
function line(n,t,a){
  let l=!t&&!a?`${n} : 0`:!t?`${n} : 0 / ${a}`:!a?`${n} : ${t} / 0`:n==='RTD BEANSPOT'?`${n} : ${t}/${a}`:`${n} : ${t} / ${a}`;
  if(S.o.acv&&t>0)l+=` (${pc(a,t)}%)`;return l;
}
function pack(list){return S.o.pack&&list.length?'\n\n*Stok Kemasan (Terpakai)*\n'+list.join('\n'):''}
function shiftText(n,s){
  let t='*Laporan Fokus Marketing*\n\n';
  if(S.o.dt)t+=`Tanggal : ${ld(S.date)}\n`;
  t+=`Shift : ${n}\nKasir : ${s.kasir||'-'}\nStaff : ${s.staff||'-'}\n\nTarget/Acv/%\n`;
  t+=num(s.st)||num(s.sa)?`Sales : ${fmt(num(s.st))} / ${fmt(num(s.sa))} (${pc(num(s.sa),num(s.st))}%)\n`:'Sales : \n';
  t+=`STD Member : ${s.tstd||'100%'}/${s.astd||''}\n\n`;
  t+=s.m.map(x=>line(x.n,num(x.t),num(x.a))).join('\n');
  return(t+pack(s.k.map(x=>`${x.n} : ${num(x.aw)} / ${num(x.ak)} (${use(x)} pcs)`))).trim();
}
function totalText(es){
  if(!es.length)return'Belum ada total.\nPilih shift di tab Total harian, lalu tekan "Hitung total".';
  const a=agg(es),nm=k=>es.map(e=>e.s[k]?`${e.s[k]} (S${e.n})`:null).filter(Boolean).join(', ')||'-';
  let t='*Laporan Fokus Marketing*\n*Total Harian*\n\n';
  if(S.o.dt)t+=`Tanggal : ${ld(S.date)}\n`;
  t+=`Shift : ${es.map(e=>e.n).join(', ')}\nKasir : ${nm('kasir')}\nStaff : ${nm('staff')}\n\nTarget/Acv/%\n`;
  t+=`Sales : ${fmt(a.t)} / ${fmt(a.a)} (${pc(a.a,a.t)}%)\n`;
  es.forEach(e=>{t+=`   Shift ${e.n} : ${fmt(num(e.s.st))} / ${fmt(num(e.s.sa))} (${pc(num(e.s.sa),num(e.s.st))}%)\n`});
  t+=`STD Member : ${a.sa==null?'-':'rata-rata '+r1(a.sa)+'%'}\n\n`;
  t+=a.it.map(i=>line(i.n,i.t,i.a)).join('\n');
  return(t+pack(a.pk.map(p=>`${p.n} : ${p.aw} / ${p.ak} (${p.u} pcs)`))).trim();
}

// Laporan cetak / pratinjau
function rep(es){
  const T=S.view==='total',a=agg(es),sn=es.map(e=>e.n),u=k=>[...new Set(es.map(e=>e.s[k]).filter(Boolean))].join(', ')||'–';
  const th=T?sn.map(n=>`<th class="n">S${n}</th>`).join(''):'',td=p=>T?sn.map(n=>`<td class="n">${p[n]===undefined?'–':fmt(p[n])}</td>`).join(''):'';
  const rows=es.map(e=>`<tr><td>Shift ${e.n}</td><td>${esc(e.s.kasir||'–')}</td><td class="n">${fmt(num(e.s.st))}</td><td class="n">${fmt(num(e.s.sa))}</td><td class="n">${ac(num(e.s.st),num(e.s.sa))}</td><td class="n">${esc(e.s.astd||'–')} <span class="m">/ ${esc(e.s.tstd||'100%')}</span></td></tr>`).join('');
  const foot=T?`<tfoot><tr><td colspan="2">Total</td><td class="n">${fmt(a.t)}</td><td class="n">${fmt(a.a)}</td><td class="n">${ac(a.t,a.a)}</td><td class="n">${a.sa==null?'–':r1(a.sa)+'% <span class="m">rata-rata</span>'}</td></tr></tfoot>`:'';
  return`<div class="rp"><h1>Laporan Fokus Marketing</h1><div class="sub">${T?'Total harian':'Shift '+S.view} · ${esc(ld(S.date))}</div>
  <table class="meta" style="margin-top:14px"><tr><th>Shift</th><td>${sn.join(', ')||'–'}</td><th>Tanggal</th><td>${esc(ld(S.date))}</td></tr><tr><th>Kasir</th><td>${esc(u('kasir'))}</td><th>Staff</th><td>${esc(u('staff'))}</td></tr></table>
  <h3>Penjualan dan member</h3><div class="tw"><table><thead><tr><th>Shift</th><th>Kasir</th><th class="n">Target (Rp)</th><th class="n">Aktual (Rp)</th><th class="n">ACV</th><th class="n">STD Member</th></tr></thead><tbody>${rows}</tbody>${foot}</table></div>
  ${a.it.length?`<h3>Item fokus marketing</h3><div class="tw"><table><thead><tr><th>Item</th>${th}<th class="n">Target</th><th class="n">Aktual</th><th class="n">ACV</th></tr></thead><tbody>${a.it.map(i=>`<tr><td>${esc(i.n)}</td>${td(i.p)}<td class="n">${fmt(i.t)}</td><td class="n">${fmt(i.a)}</td><td class="n">${ac(i.t,i.a)}</td></tr>`).join('')}</tbody></table></div>`:''}
  ${a.pk.length?`<h3>Stok kemasan terpakai</h3><div class="tw"><table><thead><tr><th>Kemasan</th>${th}<th class="n">Stok awal</th><th class="n">Stok akhir</th><th class="n">Terpakai</th></tr></thead><tbody>${a.pk.map(p=>`<tr><td>${esc(p.n)}</td>${td(p.p)}<td class="n">${fmt(p.aw)}</td><td class="n">${fmt(p.ak)}</td><td class="n">${fmt(p.u)} pcs</td></tr>`).join('')}</tbody></table></div>`:''}
  <div class="sg"><div>Kasir</div><div>Staff</div><div>Mengetahui</div></div><div class="ft">Dicetak ${esc(new Date().toLocaleString('id-ID'))}</div></div>`;
}

// Render
const tb=(v,l,s)=>`<button data-v="${v}" class="${S.view===v?'on':''}"><b>${l}</b><small>${s}</small></button>`;
function tabs(){
  const d=S.days.cur||{},f=n=>d[n]&&fill(d[n]);
  $('tabs').innerHTML=[1,2,3].map(n=>tb(''+n,'Shift '+n,f(n)?'● Terisi':'○ Kosong')).join('')+tb('total','Total harian',S.tot.es?S.tot.es.length+' shift dihitung':'Hitung manual');
}
function kpi(){
  const es=view(),a=agg(es),T=S.view==='total',p=pc(a.a,a.t),w=a.it.filter(i=>i.t>0),h=w.filter(i=>i.a>=i.t).length,u=a.pk.reduce((x,i)=>x+i.u,0);
  const sd=T?(a.sa==null?'–':r1(a.sa)+'%'):(es[0].s.astd||'–');
  $('kpi').innerHTML=`<div class="kp"><div class="k w2"><span>${T?'Penjualan total':'Penjualan shift '+S.view}</span><strong>Rp ${fmt(a.a)}</strong><em>Target Rp ${fmt(a.t)} · ACV <b>${a.t?p+'%':'–'}</b></em><div class="bar"><i style="width:${Math.min(100,p)}%;background:${col(p)}"></i></div></div>
  <div class="k"><span>STD Member</span><strong>${esc(sd)}</strong><em>${T?'rata-rata per shift':'target '+esc(es[0].s.tstd)}</em></div>
  <div class="k"><span>Item tercapai</span><strong>${h}<small> dari ${w.length}</small></strong><em>item bertarget</em></div>
  <div class="k"><span>Kemasan terpakai</span><strong>${fmt(u)}<small> pcs</small></strong><em>${a.pk.length} jenis</em></div></div>`;
}
const cell=(l,k,v,t)=>`<td><input ${t?'type="number" min="0" inputmode="numeric"':''} data-l="${l}" data-k="${k}" value="${t?num(v):esc(v)}"></td>`;
const row=(l,x,i)=>`<tr data-i="${i}">${cell(l,'n',x.n)}${l==='m'?cell(l,'t',x.t,1)+cell(l,'a',x.a,1):cell(l,'aw',x.aw,1)+cell(l,'ak',x.ak,1)}<td class="c" data-c></td><td><button class="x" data-a="del" data-l="${l}" aria-label="Hapus baris">×</button></td></tr>`;
const SUB=[['data','Sales & Member'],['item','Item Fokus'],['kemasan','Stok Kemasan'],['laporan','Laporan WA']];
function form(n){
  const s=sh(n),nx=SUB[SUB.findIndex(x=>x[0]===S.sub)+1];
  const bar=`<div class="sub">${SUB.map(([k,l],j)=>`<button data-sub="${k}" class="${S.sub===k?'on':''}"><i>${j+1}</i>${l}</button>`).join('')}</div>`;
  const P={
  data:`<div class="card"><div class="hd"><div><h2>Shift ${n}</h2><p class="mu">Isi nama kasir dan staff.</p></div><button class="gh" data-a="clr">Kosongkan shift</button></div>
    <div class="g2 s"><label>Kasir<input data-f="kasir" value="${esc(s.kasir)}" placeholder="Nama kasir" autocomplete="off"></label><label>Staff<input data-f="staff" value="${esc(s.staff)}" placeholder="Nama staff" autocomplete="off"></label></div></div>
    <div class="card"><h2 style="margin-bottom:12px">Penjualan dan STD Member</h2><div class="g2 s">
    <div class="bx"><div class="hd" style="margin-bottom:4px"><b>Sales (Rp)</b><span id="sb"></span></div><div class="g2"><label>Target<input type="number" min="0" inputmode="numeric" data-f="st" value="${num(s.st)}"></label><label>Aktual<input type="number" min="0" inputmode="numeric" data-f="sa" value="${num(s.sa)}"></label></div><div class="bar"><i id="sbar"></i></div></div>
    <div class="bx"><b>STD Member (%)</b><div class="g2"><label>Target<input data-f="tstd" value="${esc(s.tstd)}"></label><label>Aktual<input data-f="astd" value="${esc(s.astd)}" placeholder="85%"></label></div></div></div></div>`,
  item:`<div class="card"><div class="hd"><div><h2>Item fokus marketing</h2><p class="mu">Isi target dan aktual tiap item.</p></div><button class="ad" data-a="add" data-l="m">+ Tambah item</button></div>
    <div class="tw"><table><thead><tr><th>Item</th><th>Target</th><th>Aktual</th><th>ACV</th><th></th></tr></thead><tbody id="bm">${s.m.map((x,i)=>row('m',x,i)).join('')}</tbody></table></div></div>`,
  kemasan:`<div class="card"><div class="hd"><div><h2>Stok kemasan</h2><p class="mu">${n>1?'Stok awal mengikuti stok akhir shift sebelumnya saat shift ini dibuat.':'Dalam pcs. Terpakai dihitung otomatis.'}</p></div><button class="ad" data-a="add" data-l="k">+ Tambah kemasan</button></div>
    <div class="tw"><table><thead><tr><th>Kemasan</th><th>Awal</th><th>Akhir</th><th>Terpakai</th><th></th></tr></thead><tbody id="bk">${s.k.map((x,i)=>row('k',x,i)).join('')}</tbody></table></div></div>`,
  laporan:`<div class="card"><div class="hd"><span class="mu">Pratinjau laporan shift ${n}</span></div>${rep([{n,s}])}</div>`};
  $('main').innerHTML=bar+P[S.sub]+(nx?`<div class="nx"><button class="btn" data-sub="${nx[0]}">Lanjut: ${nx[1]} ›</button></div>`:'');
}
function totalPanel(){
  const d=S.days.cur||{},t=S.tot,es=t.es;
  $('main').innerHTML=`<div class="card"><h2>Hitung total harian</h2><p class="mu">Pilih shift yang mau dijumlahkan, lalu tekan tombol. Hasil baru berubah kalau kamu menekan tombol lagi, jadi tekan ulang setelah mengubah data shift.</p>
  <div class="pick">${[1,2,3].map(n=>`<label><input type="checkbox" data-u="${n}" ${t.use[n]?'checked':''}> Shift ${n} <small>${d[n]&&fill(d[n])?'● terisi':'○ kosong'}</small></label>`).join('')}</div>
  <button class="btn" data-a="calc">Hitung total</button></div>`+(es?`<div class="card">${es.length?rep(es):'<p class="mu">Tidak ada shift yang dipilih.</p>'}</div>`:'');
}
function out(){
  const T=S.view==='total';
  $('ot').textContent=T?'WhatsApp · Total harian':'WhatsApp · Shift '+S.view;
  $('tx').value=T?totalText(S.tot.es||[]):shiftText(+S.view,sh(+S.view));
}
function calc(){
  if(S.view!=='total'){
    const s=sh(+S.view);
    document.querySelectorAll('#bm tr').forEach(tr=>{const x=s.m[+tr.dataset.i];if(x)tr.querySelector('[data-c]').innerHTML=bd(num(x.t),num(x.a))});
    document.querySelectorAll('#bk tr').forEach(tr=>{const x=s.k[+tr.dataset.i];if(x)tr.querySelector('[data-c]').innerHTML=fmt(use(x))+' pcs'+(num(x.ak)>num(x.aw)?'<span class="w">akhir &gt; awal</span>':'')});
    const p=pc(num(s.sa),num(s.st));if($('sb')){$('sb').innerHTML=bd(num(s.st),num(s.sa));$('sbar').style.cssText=`width:${Math.min(100,p)}%;background:${col(p)}`}
  }
  tabs();kpi();out();
}
function render(){
  $('dt').value=S.date;
  const so=S.view==='total'||S.sub==='laporan';
  document.querySelector('.out').style.display=so?'':'none';$('cols').classList.toggle('one',!so);
  S.view==='total'?totalPanel():form(+S.view);calc();
}

// ===== Sinkron ke Supabase (data tersimpan per kode toko + tanggal + shift) =====
const SB_URL='https://fkniwawchvrzxxvztobq.supabase.co',SB_KEY='sb_publishable_mQjOY3wiMw4-GyQJX7bYVA_SYN97XMg';
const CFG_OK=!/GANTI/.test(SB_URL+SB_KEY),AK='kasir_toko_v1';
let A=null;try{const U=JSON.parse(localStorage.getItem('kkso_v3')||'null');if(U&&U.token&&U.store)A={code:U.store.code,name:U.store.name,token:U.stafToken||U.token}}catch(e){}
const dirty=new Set();let tmr=null,q=Promise.resolve();

async function rpc(fn,args,ms=9000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{
    const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify(args),signal:c.signal});
    const j=await r.json().catch(()=>null);
    if(!r.ok){const m=(j&&j.message)||'',e=new Error(m||'HTTP '+r.status);e.auth=m==='AUTH';throw e}
    return j;
  }finally{clearTimeout(t)}
}
function chip(s){
  const m={ok:['● Tersimpan','#6ee7b7'],wait:['◌ Menyimpan…','#fde68a'],sync:['◌ Menyinkronkan…','#fde68a'],off:['⚠ Offline','#fca5a5'],err:['⚠ Belum tersimpan, cek internet','#fca5a5'],'':['','']}[s];
  $('chip').textContent=m[0];$('chip').style.color=m[1];
}
const norm=s=>{const b=mk(null),o=s&&typeof s==='object'?s:{};return Object.assign(b,o,{m:Array.isArray(o.m)?o.m:b.m,k:Array.isArray(o.k)?o.k:b.k})};

// Simpan: dipanggil tiap ada perubahan, dikirim setelah jeda 0,8 detik
const save=()=>{if(!A||S.view==='total')return;dirty.add(S.date+'|'+S.view);chip('wait');clearTimeout(tmr);tmr=setTimeout(flush,800)};
const flush=()=>q=q.then(sendAll,sendAll);
async function sendAll(){
  clearTimeout(tmr);if(!A||!dirty.size)return;
  let bad=false;
  for(const k of [...dirty]){
    const [d,n]=k.split('|'),s=d===S.date&&S.days.cur&&S.days.cur[n];
    if(!s){dirty.delete(k);continue}
    const snap=JSON.stringify(s);
    try{
      await rpc('save_shift',{p_token:A.token,p_date:d,p_shift:+n,p_data:s});
      if(JSON.stringify(S.days.cur[n])===snap)dirty.delete(k);
    }catch(e){if(e.auth){authFail();return}bad=true;break}
  }
  chip(bad?'err':dirty.size?'wait':'ok');
  if(dirty.size){clearTimeout(tmr);tmr=setTimeout(flush,bad?10000:300)}
}

// Ambil data hari ini dari server. keep=true: jangan timpa shift yang sedang dibuka di form
async function pull(keep,ms=9000){
  if(!A)return false;
  const dt=S.date;
  try{
    const rows=await rpc('get_day',{p_token:A.token,p_date:dt},ms);
    if(dt!==S.date)return false;
    const got={},d=day();(rows||[]).forEach(r=>got[r.shift]=r.data);
    [1,2,3].forEach(n=>{
      if(dirty.has(dt+'|'+n)||(keep&&S.view===''+n))return;
      if(got[n])d[n]=norm(got[n]);else delete d[n];
    });
    chip(dirty.size?'wait':'ok');return true;
  }catch(e){if(e.auth)authFail();else chip(dirty.size?'err':'off');return false}
}

let mode='in';
function setMode(m){
  mode=m;$('m1').classList.toggle('on',m==='in');$('m2').classList.toggle('on',m==='reg');
  $('fn').hidden=$('fp').hidden=m==='in';$('lb').textContent=m==='in'?'Masuk':'Daftar & masuk';
  $('lgh').textContent=m==='in'?'Masukkan kode toko. Cukup sekali di HP ini.':'Buat kode toko baru. Butuh PIN pendaftaran dari pemilik aplikasi.';
  $('lgm').textContent='';
}
function showLogin(m){location.replace('index.html');return;
  setMode('in');$('lg').hidden=false;$('sn').textContent='belum masuk';chip('');
  $('lgm').textContent=m||(CFG_OK?'':'Belum dikonfigurasi: isi SB_URL dan SB_KEY di file index.html.');
}
function authFail(){location.replace('index.html')}
async function boot(){
  $('sn').textContent=A.name+' · '+A.code;
  S.days={};S.tot.es=null;S.view='1';S.sub='data';
  $('main').innerHTML='<div class="card"><p class="mu">Memuat data toko…</p></div>';
  chip('sync');await pull();render();
}
const REG_ERR={PIN_SALAH:'PIN pendaftaran salah.',TERLALU_BANYAK:'Terlalu banyak percobaan salah. Coba lagi 15 menit lagi.',KODE_SUDAH_ADA:'Kode toko itu sudah dipakai. Pilih kode lain.',KODE_TIDAK_VALID:'Kode toko harus 6–20 karakter: huruf, angka, atau tanda minus (-).',NAMA_TIDAK_VALID:'Nama toko kosong atau lebih dari 60 karakter.',BELUM_DISETEL:'Aplikasi belum disetel pemilik (PIN pendaftaran belum dibuat di Supabase).'};
async function doLogin(){
  if(!CFG_OK)return showLogin();
  const code=$('lc').value.trim().toUpperCase(),b=$('lb'),msg=t=>{$('lgm').textContent=t};
  if(!/^[A-Z0-9-]{6,20}$/.test(code)){msg(REG_ERR.KODE_TIDAK_VALID);return}
  b.disabled=true;msg('');
  try{
    if(mode==='reg'){
      const nm=$('ln').value.trim(),pin=$('lp').value;
      if(!nm){msg('Isi nama toko.');return}
      if(!pin){msg('Isi PIN pendaftaran.');return}
      const r=await rpc('register_store',{p_reg_pin:pin,p_code:code,p_name:nm});
      if(r!=='OK'){msg(REG_ERR[r]||'Pendaftaran gagal.');return}
    }
    const name=await rpc('store_login',{p_code:code});
    A={code,name:name||code};try{localStorage.setItem(AK,JSON.stringify(A))}catch(e){}
    $('lg').hidden=true;$('lp').value='';$('ln').value='';await boot();
  }catch(e){msg(e.auth?'Kode toko tidak ditemukan. Cek penulisannya, atau daftar toko baru.':'Tidak bisa terhubung. Periksa internet lalu coba lagi.')}
  finally{b.disabled=false}
}

window.addEventListener('beforeunload',e=>{if(dirty.size){e.preventDefault();e.returnValue=''}});
window.addEventListener('online',flush);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){flush();return}
  if(A&&!dirty.size)pull(true).then(ok=>{if(ok){tabs();if(S.view==='total')render()}});
});
setInterval(async()=>{if(document.hidden||!A||dirty.size)return;if(await pull(true)){tabs();if(S.view==='total')render()}},20000);

// Event
const go=(d,v)=>{if(d)S.date=d;if(v)S.view=v;render()};
$('tabs').onclick=async e=>{const b=e.target.closest('[data-v]');if(!b)return;await flush();await pull(false,4000);go(0,b.dataset.v)};
$('dt').onchange=async e=>{
  const nd=e.target.value||iso();
  await flush();
  if(dirty.size&&!confirm('Ada data yang belum tersimpan (koneksi bermasalah). Tetap pindah tanggal? Data itu akan hilang.')){e.target.value=S.date;return}
  dirty.clear();S.date=nd;S.days={};S.tot.es=null;
  $('main').innerHTML='<div class="card"><p class="mu">Memuat data…</p></div>';chip('sync');
  await pull();render();
};
$('rs').onclick=async()=>{
  if(!confirm('Hapus SEMUA isian Shift 1–3 untuk tanggal ini? Data di server (semua kasir toko ini) ikut terhapus dan tidak bisa dikembalikan.'))return;
  if(A){try{await rpc('delete_day',{p_token:A.token,p_date:S.date})}catch(e){alert(/TIDAK_BERHAK/.test(e.message)?'Reset hari hanya bisa dilakukan staf (login staf di aplikasi utama).':'Gagal menghapus di server. Periksa koneksi internet.');return}}
  dirty.clear();S.days={};S.tot.es=null;S.sub='data';S.view='1';render();
};
$('lo').onclick=async()=>{
  await flush();
  if(dirty.size&&!confirm('Ada data yang belum tersimpan. Tetap kembali ke menu?'))return;
  location.href='index.html';
};
$('lb').onclick=doLogin;
$('m1').onclick=()=>setMode('in');$('m2').onclick=()=>setMode('reg');
$('lg').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
[['oa','acv'],['op','pack'],['od','dt']].forEach(([id,k])=>{$(id).checked=S.o[k];$(id).onchange=e=>{S.o[k]=e.target.checked;out()}});
$('main').addEventListener('input',e=>{
  const el=e.target;if(el.dataset.u){S.tot.use[el.dataset.u]=el.checked;return}
  const s=S.view==='total'?null:sh(+S.view);if(!s)return;
  if(el.dataset.f)s[el.dataset.f]=el.type==='number'?num(el.value):el.value;
  else if(el.dataset.l){const r=s[el.dataset.l][+el.closest('tr').dataset.i];if(!r)return;r[el.dataset.k]=el.dataset.k==='n'?el.value:num(el.value)}
  else return;
  calc();save();
});
$('main').addEventListener('click',async e=>{
  const u=e.target.closest('[data-sub]');if(u){S.sub=u.dataset.sub;render();window.scrollTo({top:0});return}
  const v=e.target.closest('[data-v]');if(v){go(0,v.dataset.v);return}
  const b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.a==='calc'){await flush();await pull(false,6000);S.tot.es=[1,2,3].filter(n=>S.tot.use[n]).map(n=>({n,s:JSON.parse(JSON.stringify(sh(n)))}));render();return}
  const s=S.view==='total'?null:sh(+S.view);if(!s)return;
  if(b.dataset.a==='add'){const l=b.dataset.l;s[l].push(l==='m'?{n:'ITEM BARU',t:0,a:0}:{n:'Kemasan baru',aw:0,ak:0});render();save();const r=document.querySelectorAll(`#b${l} tr`),i=r[r.length-1].querySelector('input');i.focus();i.select()}
  else if(b.dataset.a==='del'){s[b.dataset.l].splice(+b.closest('tr').dataset.i,1);render();save()}
  else if(b.dataset.a==='clr'&&confirm('Kosongkan semua isian shift '+S.view+'?')){day()[+S.view]=mk(prev(+S.view));render();save()}
});
$('cp').onclick=async()=>{
  try{await navigator.clipboard.writeText($('tx').value)}catch(e){$('tx').select();document.execCommand('copy')}
  $('cp').textContent='Tersalin ✓';setTimeout(()=>$('cp').textContent='Salin',1500);
};
$('wa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent($('tx').value),'_blank','noopener');
$('pr').onclick=()=>{const es=view();if(!es.length){alert('Belum ada shift terisi untuk dicetak.');return}$('pa').innerHTML=rep(es);window.print()};
if(A&&CFG_OK)boot();else{render();showLogin()}
</script>
